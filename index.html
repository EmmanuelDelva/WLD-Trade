  H.push(`<div class="card"><h2>Patrones que veo ahora mismo</h2>${
    setups.length ? setups.map(s=>`<div class="kv"><span class="k">${s===G?'<span class="ac">▶</span>':'&nbsp;&nbsp;'}
      <span class="pill">${s.tf}</span> ${s.s}</span><span class="v ${s.d==='long'?'up':'dn'}">${
      s.d==='long'?'A LA ALZA':'A LA BAJA'}</span></div>
      <div class="sub" style="margin-left:20px">${s.n}</div>`).join("")
    : `<div class="nd" style="font-size:12.5px">Ninguno. No es que esté apagada: revisé las
       velas cerradas de 1m a 1d y no hay ninguno de los 7 patrones que sé reconocer sola.</div>`}
    ${cruce(setups.length
      ? `Son patrones <b>activos en este momento</b>, sacados de las velas ya cerradas — no son
         alertas viejas ni una lista de lo que existe. Solo se opera <b>uno</b>: el que tiene
         <span class="ac">▶</span>, que es <b>${G.s} ${G.d==='long'?'a la alza':'a la baja'} en ${G.tf}</b>.
         Gana porque en ${G.tf} es el patrón de mayor prioridad de tu banco${
         setups.length>1?`; los otros ${setups.length-1} existen pero quedan de respaldo`:""}.${
         conflicto?" <b class='wa'>Ojo: hay patrones apuntando a lados opuestos, y eso te baja la nota.</b>":""}`
      : `Reviso solos: Sweep+Reclaim, BOS+Retest, FVG, EQH/EQL, Mean-Reversion, Momentum de
         apertura NY e Impulso+Pullback. Los otros de tu banco —CHoCH+OB, OB de temporalidad
         alta, Wyckoff, Three-Drives y Range-HVN— necesitan que <b>tú</b> marques la estructura
         en el gráfico. Si ves uno, mándame captura con <b>opera</b> y lo evalúo yo.`,
      setups.length?"":"ojo")}</div>`);

  // ── QUÉ VIGILAR + CUÁNDO VOLVER ──
  if(!G || bloqueos.length){
    const tf=(G&&G.tf)||tfEnt, cr=D.v[tf]||[];
    if(cr.length>60){
      const v=cerradas(cr), a=atr(v), mk=D.mark, [hi,lo]=swings(v);
      const cands=[];
      const nh=hi.length?Math.max(...hi.slice(-4).map(x=>x[1])):null;
      const nl=lo.length?Math.min(...lo.slice(-4).map(x=>x[1])):null;
      if(nh&&nh>mk) cands.push([nh-mk,`Sweep del máximo ${f(nh)} → SHORT`,
        `mecha más allá de ${f(nh)} y cierre de ${tf} de vuelta dentro`,
        `cierre limpio sobre ${f(nh)} = ruptura genuina, no barrido`]);
      if(nl&&nl<mk) cands.push([nl-mk,`Sweep del mínimo ${f(nl)} → LONG`,
        `mecha más allá de ${f(nl)} y cierre de ${tf} de vuelta dentro`,
        `cierre limpio bajo ${f(nl)} = ruptura genuina, no barrido`]);
      cands.sort((x,y)=>Math.abs(x[0])-Math.abs(y[0]));
      if(cands.length) H.push(`<div class="card"><h2>Qué vigilar</h2>${
        cands.slice(0,2).map(c=>`<div style="margin-bottom:9px">
          <div style="font-size:13px;font-weight:600">${c[1]}</div>
          <div class="sub">se activa · ${c[2]}</div>
          <div class="sub">se descarta · ${c[3]}</div>
          <div class="sub ac">${(c[0]/mk*100>=0?"+":"")}${(c[0]/mk*100).toFixed(2)}% · ${(Math.abs(c[0])/a).toFixed(1)} ATR · ~${minsTxt(Math.abs(c[0])/(0.6*a)*tfH(tf)*60)} al ritmo actual</div>
        </div>`).join("")}</div>`);

      // ── CUÁNDO VOLVER: el checkpoint mas cercano que puede CAMBIAR el veredicto ──
      const ck=[];
      // 1) cierre de la vela del TF de entrada: los setups confirman al cierre
      const durMin=tfH(tf)*60, ultima=cr[cr.length-1].t;
      const faltaVela=Math.max(0, durMin-(Date.now()-ultima)/60000);
      ck.push([faltaVela, `cierra la vela de ${tf}`, "los setups confirman al cierre, no antes"]);
      // 2) llegada al nivel mas cercano al ritmo actual
      if(cands.length){ const d=Math.abs(cands[0][0]);
        ck.push([d/(0.6*a)*durMin, `el precio alcanza ${f(mk+cands[0][0])}`,
          cands[0][1].replace(/ →.*/,"")]); }
      // 3) settlement de funding: cambia el gate direccional
      if(D.fundNext<180) ck.push([D.fundNext, "settlement de funding",
        "cambia el costo del horizonte y puede desbloquear/bloquear"]);
      // 4) bloqueos con reloj propio
      if(bloqueos.some(b=>b.includes("evento"))&&ev)
        ck.push([Math.max(0,(ev.ts+1800e3-now.getTime())/60000), "termina la ventana ±30min del evento",
          "hasta entonces no se abre dirección"]);
      ck.sort((x,y)=>x[0]-y[0]);
      const prox=ck[0];
      H.push(`<div class="card" style="border-color:var(--acc)">
        <h2>Cuándo volver a revisar</h2>
        <div style="font-size:17px;font-weight:700" class="ac">~${minsTxt(prox[0])}</div>
        <div class="sub" style="margin-top:2px">${prox[1]} — ${prox[2]}</div>
        ${ck.length>1?`<div class="sub" style="margin-top:7px;color:var(--dim2)">después: ${
          ck.slice(1,3).map(c=>`${minsTxt(c[0])} · ${c[1]}`).join(" · ")}</div>`:""}
        <div class="sub" style="margin-top:7px">Estimación por velocidad ATR y relojes reales
          (vela, funding, evento). No es una promesa: si el precio se acelera, llega antes.</div>
      </div>`);
      LAST_ETA=prox;
    }
  }

  H.push(`<div class="card"><h2>Lo que esto NO sabe</h2>
    <div class="sub">· si existe plan W1 y si este par está en la watchlist de hoy</div>
    <div class="sub">· posiciones abiertas correlacionadas (tope agregado 3%)</div>
    <div class="sub">· tu estado mental — puntos 8, 9 y 10 del checklist</div>
    <div class="sub" style="margin-top:5px;color:var(--dim)">Esos gates los pones tú.
      Las pérdidas del día, la racha y el tope de −6× SÍ los sabe ahora: están arriba,
      en <b>Tu día</b> — pero solo si vas marcando cada cierre.</div></div>`);

  // symFull/marUsr/levUsr se guardan para que repintar() pueda redibujar tras
  // marcar un cierre sin volver a consultar Binance
  LAST={D,G,plan,setups,tier,estilo,eq,riesgo,ses,bloq:bloqueos,evOn,
        sym:base, symFull:sym, marUsr, levUsr, ts:(D.__ts||Date.now()), calidad};

  // ── aviso: solo en TRANSICIÓN a operable, nunca repetido ──
  const verAhora = !G ? "sin-setup" : (bloqueos.length ? "bloqueado" : "OPERAR");
  if(ULTIMO_VER && ULTIMO_VER !== verAhora && verAhora === "OPERAR" && plan && plan.qty){
    avisar(`${SYM} · OPERAR ${G.d.toUpperCase()}`,
      `${G.s} en ${G.tf} · entrada ${f(plan.entry)} · stop ${f(plan.stop)} · ${plan.lev}x · ` +
      `TP1 ${f(plan.tps[0].px)} (${plan.tps[0].rn.toFixed(2)}R)`);
  }
  // aviso secundario: el precio entró en una zona vigilada aunque aún no confirme
  if(ULTIMO_VER && G && bloqueos.length && G.z){
    const dentro = D.mark>=Math.min(...G.z) && D.mark<=Math.max(...G.z);
    if(dentro && !ZONA_AVISADA){ ZONA_AVISADA=true;
      avisar(`${SYM} · precio en la zona`,
        `${G.s} ${G.d.toUpperCase()} en ${G.tf}: el precio entró en ${f(Math.min(...G.z))}–${f(Math.max(...G.z))}. Falta el cierre que confirme.`);
    } else if(!dentro) ZONA_AVISADA=false;
  }
  ULTIMO_VER = verAhora;

  $("#out").innerHTML=H.join("");
  $("#clock").textContent=now.toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit"})+" · "+ses;
}

function dimensionar(D,G,eq,riesgo,estilo,E,TC,sym,contra,contra8,marUsr,levUsr){
  // bloq = DUROS (vetan) · blandos = advertencias que solo degradan a MARGINAL
  const p={bloq:[],avisos:[],blandos:[]};
  const a=G.atr||atr(cerradas(D.v[G.tf]));
  if(!a){ p.bloq.push("sin ATR: no se puede proponer stop"); return p; }
  const dir=G.d, sg=dir==="long"?1:-1, mk=D.mark;

  // entrada: limit en zona para setups de zona, mercado para los de confirmación
  const aMercado=["Sweep+Reclaim","Mean-Reversion"].includes(G.s);
  let entry, tipo;
  if(aMercado||!G.z){ entry=q(mk,TICK); tipo="mercado"; }
  else{ entry=q(dir==="long"?Math.max(...G.z):Math.min(...G.z),TICK); tipo="limit en zona";
    const reb = dir==="long" ? mk<Math.min(...G.z) : mk>Math.max(...G.z);
    if(reb){ p.bloq.push(`setup caducado: el precio ya rebasó la zona en contra`); return p; }
    if(Math.abs(entry-mk)/a>3){ p.bloq.push(`la zona está a ${(Math.abs(entry-mk)/a).toFixed(1)} ATR: no es un trade de ahora`); return p; } }

  let base = G.z ? (dir==="long"?Math.min(...G.z):Math.max(...G.z)) : (dir==="long"?entry-a:entry+a);
  let stop = q(dir==="long"?base-0.35*a:base+0.35*a, TICK);
  if((dir==="long"&&stop>=entry)||(dir==="short"&&stop<=entry)){
    p.bloq.push("el stop quedaría del lado equivocado"); return p; }
  // stop mínimo 0.5 ATR: más ceñido está DENTRO del ruido e infla el R
  if(Math.abs(entry-stop)<0.5*a){
    stop=q(dir==="long"?entry-0.5*a:entry+0.5*a,TICK);
    p.avisos.push("stop ensanchado a 0.5 ATR: el original estaba dentro del ruido"); }

  const stopPct=Math.abs(entry-stop)/entry, rU=Math.abs(entry-stop);
  const ticks=rU/TICK;
  p.entry=entry; p.stop=stop; p.stopPct=stopPct*100; p.atrPct=a/mk*100; p.atrAbs=a;
  p.stopATR=rU/a; p.ticks=ticks; p.tipo=tipo;
  // 1 decimal: con toFixed(0) un stop de 19.6 ticks se leía "20 ticks (mínimo 20)",
  // que parece una contradicción y hace desconfiar de la herramienta
  if(TICK/a > TICK_ATR_MAX){ p.bloq.push(`el tick (${TICK}) es el ${(TICK/a*100).toFixed(0)}% del ATR de ${G.tf}: este símbolo no puede expresar un stop con precisión en este TF`); return p; }
  if(ticks<TICKS_MIN){ p.bloq.push(`stop de ${ticks.toFixed(1)} ticks (mínimo ${TICKS_MIN}): la cuantización distorsionaría el R:R`); return p; }
  const topeStop={scalp:0.015,intraday:0.04}[estilo];
  if(stopPct>topeStop){ p.bloq.push(`stop ${(stopPct*100).toFixed(2)}% supera el tope de ${topeStop*100}% para ${estilo}`); return p; }
  if(Math.abs(entry-stop)>2.5*a){ p.bloq.push(`stop de ${(Math.abs(entry-stop)/a).toFixed(1)} ATR: demasiado ancho para este setup`); return p; }

  // ── DOS MODOS DE DIMENSIONAR ──
  // MANUAL: Emmanuel escribe margen y X, como en Binance. El nocional sale de
  //   ahi y el riesgo es una SALIDA: cuanto acaba perdiendo si le pega el stop.
  // AUTOMATICO (si deja el margen en 0): el nocional sale del % de riesgo.
  const manual = marUsr>0 && levUsr>0;
  let notional, riesgoUsd;
  if(manual){
    p.manual=true;
    p.margenPedido=Math.min(marUsr,MARGEN_MAX);
    if(marUsr>MARGEN_MAX) p.avisos.push(`pediste ${marUsr} USDT de margen y tu tope son ${MARGEN_MAX}: uso ${MARGEN_MAX}`);
    notional = p.margenPedido*levUsr;
    riesgoUsd = notional*stopPct;
  } else {
    riesgoUsd = eq*riesgo/100;
    notional  = riesgoUsd/stopPct;
  }
  p.riesgoUsd=riesgoUsd;

  let br=bracketDe(sym,notional);
  if(!br){ p.bloq.push("sin brackets para este símbolo"); return p; }
  let lev;
  p.levStop=levMaxPorStop(stopPct,br.mmr);

  if(manual){
    lev=Math.floor(levUsr);
    // Estos dos SI vetan y no es capricho: por encima de levStop la liquidacion
    // cae ANTES que el stop, o sea el stop nunca llega a ejecutarse. Y por encima
    // del maximo del bracket, Binance simplemente rechaza la orden.
    if(lev>br.maxLev){
      p.bloq.push(`pediste ${lev}x y Binance solo permite ${br.maxLev}x con una posición de ${notional.toFixed(0)} USDT en ${sym.replace("USDT","")}`); return p; }
    if(lev>p.levStop){
      p.bloq.push(`a ${lev}x te liquidarían ANTES de que llegue tu stop: con este stop de ${(stopPct*100).toFixed(2)}% el máximo real son <b>${Math.floor(p.levStop)}x</b>`); return p; }
  } else {
    lev=null;
    for(let i=0;i<3;i++){
      br=bracketDe(sym,notional); if(!br){ p.bloq.push("sin brackets para este símbolo"); return p; }
      const nl=Math.max(1,Math.floor(Math.min(levMaxPorStop(stopPct,br.mmr),br.maxLev,TC.lev,LEV_MAX_USR)));
      if(nl===lev) break; lev=nl;
    }
    p.levStop=levMaxPorStop(stopPct,br.mmr);
  }
  p.br=br; p.lev=lev;

  const qty=q(notional/entry,STEP);
  if(qty<=0){ p.bloq.push(`cantidad redondea a 0 (step ${STEP})`); return p; }
  const notReal=qty*entry;
  if(notReal<MINNOT){ p.bloq.push(`nocional ${notReal.toFixed(2)} < mínimo ${MINNOT} USDT`); return p; }
  p.qty=qty; p.notional=notReal; p.margen=notReal/lev;
  // al cuantizar al step, el nocional real cambia un poco: el riesgo se recalcula
  if(p.manual) p.riesgoUsd = notReal*stopPct;

  // Tope duro de 250 USD de margen. En modo manual el margen ya viene topado
  // arriba, así que esto solo aplica al dimensionamiento automático: si el tamaño
  // que sale del riesgo pide más, se recorta y se avisa.
  if(!p.manual && p.margen>MARGEN_MAX){
    const qc=q(MARGEN_MAX*lev/entry,STEP);
    if(qc<=0){ p.bloq.push(`con tu tope de ${MARGEN_MAX} USDT de margen la cantidad redondea a 0`); return p; }
    const notC=qc*entry;
    if(notC<MINNOT){ p.bloq.push(`con tu tope de ${MARGEN_MAX} USDT de margen la posición queda en ${notC.toFixed(2)} USDT y Binance exige mínimo ${MINNOT}`); return p; }
    p.recorte={margenPedido:p.margen, riesgoPedido:p.riesgoUsd};
    p.qty=qc; p.notional=notC; p.margen=notC/lev; p.riesgoUsd=notC*stopPct;
  }
  if(p.margen>0.7*eq){ p.bloq.push(`el margen serían ${(p.margen/eq*100).toFixed(0)}% de tu cuenta y tu regla exige dejar libre al menos el 30%`); return p; }

  // Colchón stop-liquidación verificado contra liqPx() EXACTA, no contra la
  // aproximación liq≈1/L−mmr de levMaxPorStop: esa aproximación ignora el `cum`
  // del bracket y sale optimista (a 57x prometía 25.8% y la real daba 24.6%).
  // Y en vez de vetar, se BAJA el apalancamiento hasta que cumpla: menos leverage
  // con el mismo nocional solo significa apartar más margen, no un trade peor.
  {
    let bajadas=0;
    while(lev>1 && bajadas<60){
      const lq=liqPx(entry,p.qty,lev,br.mmr,br.cum,dir);
      if(!lq) break;
      const dl=Math.abs(entry-lq)/entry;
      if((dl-stopPct)/dl>=COLCHON){ p.liq=lq; p.liqPct=dl*100; p.colchon=(dl-stopPct)/dl*100; break; }
      lev--; bajadas++;
    }
    if(bajadas){
      p.lev=lev; p.margen=p.notional/lev; p.levBajado=bajadas;
      // en modo manual el apalancamiento lo puso Emmanuel: bajarlo en silencio
      // seria cambiarle la orden por detras
      if(p.manual) p.avisos.push(`bajé de ${Math.floor(levUsr)}x a <b>${lev}x</b> para que quede el ${COLCHON*100}% de aire entre tu stop y la liquidación; el margen sube a ${p.margen.toFixed(2)} USDT`);
    }
    if(p.liq==null){
      const lq=liqPx(entry,p.qty,lev,br.mmr,br.cum,dir);
      if(lq){ const dl=Math.abs(entry-lq)/entry;
        p.liq=lq; p.liqPct=dl*100; p.colchon=(dl-stopPct)/dl*100;
        if((dl-stopPct)/dl<COLCHON) p.bloq.push(`ni bajando a 1x queda colchón entre tu stop y la liquidación (${p.colchon.toFixed(1)}%, exiges ${COLCHON*100}%)`); }
    }
    if(p.margen>MARGEN_MAX) p.avisos.push(`al bajar a ${lev}x para respetar el colchón, el margen sube a ${p.margen.toFixed(0)} USDT y pasa tu tope de ${MARGEN_MAX}`);
  }

  // fricción MEDIDA del libro
  const [slip,cub]=slipLibro(D.libro,notReal,dir);
  if(!cub){ p.bloq.push(`los 50 niveles del libro no cubren ${notReal.toFixed(0)} USDT: no operable a este tamaño`); return p; }
  const feesPct = tipo==="limit en zona"?0.07:0.10;
  const friPct=feesPct+slip/100*(tipo==="limit en zona"?1:2);
  // friPct YA es entrar Y salir (0.10% = taker 0.05 dos veces; 0.07% = maker + taker,
  // y el deslizamiento trae su propio ×1/×2 según se cruce el spread una o dos veces).
  //   friReal = lo que de verdad cuesta la ida y vuelta → es lo que tiene que cubrir
  //             el break-even, o la etiqueta mentiría.
  //   friUsd  = ese mismo costo con el ×2 conservador del protocolo-sizing paso 7,
  //             que es el que castiga los "×" para no cantar victoria antes de tiempo.
  const friReal=notReal*friPct/100;
  const friUsd=friReal*2;
  // OJO: notReal y riesgoUsd son de ANTES del recorte por MARGEN_MAX. Para los
  // mensajes hay que usar los valores finales o las cifras en USDT mienten (el
  // porcentaje no cambia, porque los dos lados escalan igual, pero los USDT sí).
  const notFin=p.notional, rFin=p.riesgoUsd, friFin=notFin*friPct/100;
  p.slip=slip; p.friPct=friPct; p.friUsd=friUsd; p.friR=friFin/rFin;
  // friR2 = la fricción en la MISMA moneda que los "×": con el ×2 conservador.
  // Se usa para la pata perdedora, que también paga comisiones: cobrarle fricción
  // solo a los ganadores inclinaba la esperanza al lado optimista siempre.
  p.friR2=(friFin*2)/rFin;
  p.perdida = 1 + p.friR2;       // lo que cuesta DE VERDAD que te pegue el stop
  // Si entrar y salir se lleva más de un tercio de lo que arriesgas, el trade nace
  // peleado con sus propios costos. Pero esto AVISA, no veta: main quitó a propósito
  // los bloqueos duros de este tipo porque mataban casi todo el scalp de stop ceñido,
  // y volver a meterlos por la puerta de atrás sería deshacer esa decisión.
  // Duro solo en el extremo donde ni el primer objetivo sale positivo.
  if(p.friR2>=1){ p.bloq.push(`entrar y salir cuesta ${(friFin*2).toFixed(2)} USDT y solo arriesgas ${rFin.toFixed(2)}: ni llegando al primer objetivo sales positivo`); return p; }
  if(p.friR>0.33) p.blandos.push(`entrar y salir te cuesta ${friFin.toFixed(2)} USDT y arriesgas ${rFin.toFixed(2)}: son el <b>${(p.friR*100).toFixed(0)}%</b> de tu riesgo. Con un stop tan ceñido las comisiones se llevan buena parte del trade — no es un veto, pero el objetivo tiene que dar bastante más de lo normal para compensarlo`);

  // ═══════════════ CÓMO SE SALE — escalonado, no de golpe ═══════════════
  // Tu historial real de Binance (206 cierres, 14-jun a 10-jul) dice que las
  // entradas están bien: aciertas el 55.3%. Lo que vacía la cuenta es la SALIDA.
  // Cobrabas +0.67 veces lo que arriesgabas y aguantabas −1.69. Con eso, acertar
  // más de la mitad de las veces igual da pérdida. Nueve pérdidas pasaron de 5×
  // y la peor fue −27.4×: ahí no hubo stop.
  //
  // Antes los objetivos salían SOLO de estructura, y si no aparecían dos niveles
  // el trade se bloqueaba entero ("no se inventan objetivos"). Suena prudente,
  // pero en la práctica te dejaba sin plan de salida escrito y salías a ojo —
  // que es exactamente de donde venían esas pérdidas gigantes.
  //
  // Ahora la salida siempre existe y siempre es asimétrica:
  //   · el primer objetivo está a 1× exacto  → cobras el 40% y subes el stop
  //   · el segundo, en estructura desde 1.8× → cobras el 35%
  //   · el resto (25%) lo dejas correr con un stop que persigue al precio
  // La consecuencia importante: una operación que te da la razón, toca el primer
  // objetivo y se devuelve, ya NO acaba en cero. Acaba en +0.40. Ahí está la
  // diferencia entre tu 0.49 de profit factor y un número por encima de 1.
  const v=cerradas(D.v[G.tf]); const [hi,lo]=swings(v);
  const TOPE=8*a, sep=Math.max(0.5*rU,0.5*a);
  const niveles=[...new Set((dir==="long"?hi:lo).map(x=>x[1])
    .filter(x=>(x-entry)*sg>rU*0.5 && Math.abs(x-entry)<=TOPE))]
    .sort((x,y)=>dir==="long"?x-y:y-x)
    .reduce((acc,x)=>{ if(!acc.length||Math.abs(x-acc[acc.length-1])>=sep) acc.push(x); return acc; },[]);

  const etaDe = z => Math.abs(z-entry)/(0.6*a)*tfH(G.tf);
  const fundingEn = eta => { if(contra==null) return [0,0];
    let set=0, rest=D.fundNext/60;
    while(rest<=eta && set<24){ set++; rest+=D.ivH; }
    return [notReal*(contra/100)*set, set]; };
  const armar = (z,frac,tag,nota) => {
    const px=q(z,TICK), eta=etaDe(px), [cf,set]=fundingEn(eta);
    const rb=Math.abs(px-entry)/rU;
    return {tag,px,frac,rb,rn:rb-(friUsd+Math.max(0,cf))/riesgoUsd,etaH:eta,set,nota};
  };

  // primer objetivo — 1× exacto. No se negocia y no depende de que el gráfico coopere.
  const tp1=armar(entry+sg*rU, 0.40, "TP1", "cobras el 40% y subes el stop a que no pierdas");
  // segundo — la primera estructura que valga entre 1.8× y 3.2×; si no hay, 2× limpio
  const e2=niveles.find(x=>{const r=Math.abs(x-entry)/rU; return r>=1.8&&r<=3.2;});
  const tp2=armar(e2!=null?e2:entry+sg*2*rU, 0.35, "TP2",
    e2!=null?`cobras el 35% · sale de la estructura de ${G.tf}`:"cobras el 35% · son 2× exactos");
  // el resto — sin objetivo fijo: lo cierra el stop que persigue, no un número.
  // OJO: e2 y e3 podían caer en el MISMO nivel (una estructura a 3.05× entra en los
  // dos rangos) y dejaban dos precios idénticos. Por eso se excluye e2 y se exige
  // que el resto quede por delante del segundo objetivo.
  // El tramo que corre se acota a [3×, 5×]. Sin tope superior, una estructura
  // lejana dentro de los 8·ATR podía poner la referencia a 10× o más, y luego el
  // modelo le asignaba un 28% de probabilidad: eso inflaba la escalera completa y
  // la esperanza con un objetivo que casi nunca se toca.
  const e3=niveles.find(x=>{const r=Math.abs(x-entry)/rU; return r>=3.0&&r<=5.0&&x!==e2;});
  let px3 = e3!=null ? e3 : entry+sg*3.5*rU;
  if((px3-tp2.px)*sg <= 0) px3 = entry+sg*3.5*rU;
  const tp3=armar(px3, 0.25, "el resto",
    (e3!=null&&px3===e3)?`lo dejas correr · referencia en la estructura de ${G.tf}`
                        :"lo dejas correr · referencia en 3.5×, pero lo cierra el stop que persigue");

  // Todos los campos ANTES de cualquier salida temprana: el render lee el objeto
  // completo, y devolver p.tps a medias reventaba la pantalla.
  const conEstr = (e2!=null) || (e3!=null && px3===e3);
  p.fuente = conEstr ? `la estructura de ${G.tf} y múltiplos de lo que arriesgas`
                     : "múltiplos de lo que arriesgas (no había estructura utilizable en el tramo)";
  // el break-even de verdad no es tu entrada: es tu entrada más lo que costó entrar y salir
  p.be    = q(entry + sg*(friReal/qty), TICK);
  // DISTANCIA del stop que persigue, no un nivel. Se acota para que en el momento
  // de activarse (justo tras el segundo objetivo) NO quede por detrás del break-even:
  // con 2.5·ATR a secas y un stop menor de 1.25 ATR, el "stop que persigue" caía por
  // DEBAJO del stop original — la app te decía que la operación ya no podía hacerte
  // daño y acto seguido te mandaba a 3× en contra.
  const trailTope = Math.abs(tp2.px - p.be);
  p.trail = Math.max(TICK, Math.min(2.5*a, trailTope));
  p.trailPct = p.trail/entry*100;
  p.trailAcotado = p.trail < 2.5*a - 1e-12;
  p.tps=[tp1,tp2,tp3];

  // lo que vale esta escalera. El caso que importa no es el bonito: es el de la
  // operación que te da la razón un rato y se devuelve.
  // Los tramos no alcanzados salen en break-even = 0 neto, y eso es cierto PORQUE
  // el stop que persigue está acotado para no bajar del break-even (arriba).
  p.rMin  = 0.40*tp1.rn;                                 // solo el primero
  p.rMed  = 0.40*tp1.rn + 0.35*tp2.rn;                   // hasta el segundo
  p.rMax  = 0.40*tp1.rn + 0.35*tp2.rn + 0.25*tp3.rn;     // la escalera completa
  // Esperanza. Cada tramo pesa por lo probable que es alcanzarlo: el primero
  // siempre (está a 1× por construcción), el segundo poco más de la mitad de las
  // veces, el resto una de cada cuatro. Lo que no se alcanza sale en break-even.
  // Y la pata perdedora paga fricción igual que las ganadoras: es p.perdida, no 1.00.
  p.rGanadora = 0.40*tp1.rn + 0.35*0.55*tp2.rn + 0.25*0.28*tp3.rn;
  p.esperanza = 0.553*p.rGanadora - 0.447*p.perdida;    // respetando el stop
  // El 1.69 sale de tu P&L REALIZADO, que ya viene con las comisiones descontadas:
  // sumarle la fricción otra vez sería cobrártela dos veces.
  p.esperanzaSinStop = 0.553*p.rGanadora - 0.447*1.69;
  p.rrMin = E.rr;   // aquí arriba: hay un return temprano más abajo

  if(new Set(p.tps.map(t=>t.px)).size<3){
    p.bloq.push("dos de los tres objetivos caen en el mismo precio al ajustarlos al tick: el recorrido es demasiado corto para salir escalonado"); return p; }

  // Horizonte: AVISA, no bloquea. Que el objetivo tarde mas de lo que dura el
  // estilo no hace peligroso al trade — solo lo convierte en otro estilo. Antes
  // vetaba, y sobre WLD eso mataba practicamente todo el scalp: los TP salen de
  // estructura y la estructura no se acomoda a un reloj de 30 minutos.
  const ref=p.tps[Math.min(1,p.tps.length-1)];
  if(ref.etaH>E.maxH*1.5){
    const dur = ref.etaH<1 ? Math.round(ref.etaH*60)+" min" : ref.etaH.toFixed(1)+" h";
    const tope = E.maxH<1 ? E.maxH*60+" min" : E.maxH+" h";
    // sugerir el estilo al que SI le queda el horizonte
    const cabeEn = Object.entries(ESTILOS)
      .filter(([k,v])=>k!==estilo && ref.etaH<=v.maxH*1.5)
      .map(([k])=>k)[0];
    p.avisos.push(`el segundo objetivo tardaría ~${dur} y ${estilo} está pensado para menos de ${tope}${
      cabeEn ? `: esto en realidad es un <b>${cabeEn}</b>, no un ${estilo}. Se puede tomar igual, pero cuenta con tenerlo abierto más tiempo`
             : `: cuenta con tenerlo abierto bastante más de lo normal`}`);
  }
  if(contra8!==null&&contra8>FUND_NO) p.bloq.push(`funding ${contra8.toFixed(4)}% base-8h PROHIBITIVO contra el trade`);
  else if(contra8!==null&&contra8>FUND_OK) p.avisos.push(`funding ${contra8.toFixed(4)}% base-8h ALERTA: no mantener más de 4h`);

  // El R:R mínimo del estilo sigue vivo, pero hay que aplicarlo a algo COMPARABLE.
  //   · el primer objetivo ya no puede cumplirlo: vale 1× por diseño, y esa es la idea
  //   · el tramo que corre está a 3× o más por construcción: cumpliría siempre
  //   · la escalera completa es un promedio ponderado por fracción de posición, con
  //     techo ~1.98 por construcción — compararla con un umbral de 2.0 marcaría
  //     TODO intraday como marginal, que es no decir nada
  // Lo comparable es el objetivo PRINCIPAL: el segundo, donde sale el 75% de la
  // posición. Ese es el "cuánto gano si el trade sale bien" de tu regla de toda la vida.
  // Blando, como tú lo dejaste: advertir y pedir confirmación, no vetar.
  // Se compara en BRUTO, que es como está escrita tu regla de toda la vida
  // ("R:R 2:1"). El neto ya lo tienes tramo por tramo en la escalera, y meterlo
  // aquí marcaría como marginal casi todo intraday por el simple hecho de que las
  // comisiones existen — eso no es información, es ruido.
  if(p.tps[1].rb<E.rr)
    p.blandos.push(`el objetivo principal está a <b>${p.tps[1].rb.toFixed(2)}×</b> lo que arriesgas y tu regla de ${estilo} pide ${E.rr}× — no hay estructura por delante que dé para más`);
  if(p.esperanza<=0)
    p.blandos.push(`con tu 55.3% de acierto histórico este trade sale a <b>${p.esperanza.toFixed(3)}×</b> por operación aun respetando el stop — o el costo de entrar y salir es muy alto, o el recorrido es muy corto`);
  if(p.tps[0].rn<0.80 && tipo==="mercado")
    p.avisos.push(`entrar y salir se come el ${((1-p.tps[0].rn)*100).toFixed(0)}% del primer objetivo (queda ${p.tps[0].rn.toFixed(2)}× de 1× bruto): con orden límite en vez de a mercado te ahorras parte`);
  return p;
}

// ───────── copiar para Claude: el estado VERIFICADO, compacto ─────────
// La pagina trae los DATOS (de tu IP, sin intermediarios). Claude pone el
// JUICIO: lectura de estructura, si vale saltarse un gate, coaching. Pegar
// esto le da lo mismo que ve el disparador local, desde donde estes.
let LAST=null;
function textoParaClaude(){
  if(!LAST) return "aún sin datos — pulsa Ver primero";
  const {D,G,plan,tier,estilo,eq,riesgo,ses,bloq,evOn}=LAST;
  const L=[];
  const _s=resumenSesion(new Date());
  // simbolo y hora DE LOS DATOS (no el SYM global ni la hora de copiado):
  // si cambiaste de moneda a mitad de fetch, el rotulo mentiria
  L.push(`[PERP ${LAST.sym} · datos de ${new Date(LAST.ts).toLocaleString("es-MX")} · ${ses} · ${tier} · ${estilo} · equity ${eq} · riesgo ${riesgo}%]`);
  if(evOn) L.push(`EVENTO ACTIVO: ${evOn}`);
  L.push(`MERCADO mark ${f(D.mark)} · 24h ${pct(D.chg)} · vol ${(D.vol/1e6).toFixed(1)}M · basis ${((D.mark/D.index-1)*1e4).toFixed(1)}bps · spread ${((D.ask/D.bid-1)*1e4).toFixed(1)}bps`);
  L.push(`FUNDING ${D.fund>=0?"+":""}${D.fund.toFixed(4)}%/${D.ivH}h = ${(D.fund*8/D.ivH>=0?"+":"")}${(D.fund*8/D.ivH).toFixed(4)}% base-8h · próximo en ${D.fundNext.toFixed(0)}min`);
  L.push(`OI ${(D.oi/1e6).toFixed(1)}M${D.oiUsd?` (${(D.oiUsd/1e6).toFixed(1)}M USD, ${pct(D.oiChg)} 24h)`:""}`);
  // el estado de sesión: lo único que Binance no le puede decir a nadie
  if(_s.ops.length) L.push(`SESIÓN HOY ${_s.ops.length} cierres · ${_s.rTot>=0?"+":""}${_s.rTot.toFixed(1)}R acumulado · racha de pérdidas ${_s.racha}${
    _s.ult&&_s.ult.r<0&&_s.mins<20?` · ÚLTIMA FUE PÉRDIDA hace ${_s.mins.toFixed(0)} min`:""}${
    HORAS_ROJAS[_s.h]!=null?` · hora históricamente mala (${HORAS_ROJAS[_s.h]} USDT)`:""}`);
  L.push(`L/S retail ${D.ls.g.toFixed(4)} · topCUENTA ${D.ls.ta.toFixed(4)} · topPOSICIÓN ${D.ls.tp.toFixed(4)} · spread ${(D.ls.tp-D.ls.g>=0?"+":"")}${(D.ls.tp-D.ls.g).toFixed(4)} · taker ${D.taker.toFixed(3)} · edad ${D.lsEdad.toFixed(0)}min${D.lsEdad>90?" (VIEJA >90min, no cuenta)":""}`);
  const tf=[];
  for(const t of TF_VISTA){
    const cr=D.v[t]; if(!cr||cr.length<22) continue;
    const v=cerradas(cr), cs=v.map(x=>x.c), a=atr(v), e20=ema(cs,20), e200=ema(cs,200), px=cs[cs.length-1];
    tf.push(`${t}:RSI${(rsi(cs)||0).toFixed(0)}/ATR${a?(a/px*100).toFixed(2):"?"}%/${e20&&px>e20?"+":"−"}EMA20/${e200?(px>e200?"+":"−"):"?"}EMA200`);
  }
  L.push(`MULTI-TF (velas cerradas) ${tf.join(" · ")}`);
  L.push(`SETUPS AUTO: ${LAST.setups.length?LAST.setups.map(s=>`${s.s} ${s.d.toUpperCase()} en ${s.tf} (${s.n})`).join(" | "):"ninguno detectable — SEMI/MANUAL requieren marcar estructura"}`);
  if(plan&&plan.entry){
    L.push(`PLAN ${G.d.toUpperCase()} entrada ${f(plan.entry)} [${plan.tipo}] · stop ${f(plan.stop)} (${plan.stopPct.toFixed(3)}%, ${plan.ticks.toFixed(0)} ticks)`);
    if(plan.tps&&plan.tps.length){
      L.push(`SALIDA ESCALONADA ${plan.tps.map(t=>`${t.tag} ${f(t.px)} cierra ${Math.round(t.frac*100)}% = ${t.rn.toFixed(2)}R neto (${t.rb.toFixed(2)} bruto, ETA ${t.etaH.toFixed(1)}h)`).join(" · ")} [${plan.fuente}]`);
      if(plan.be!=null) L.push(`GESTIÓN break-even ${f(plan.be)} al tocar TP1 · trailing ${plan.trailPct.toFixed(2)}% (${f(plan.trail)}) para el resto tras TP2`);
      if(plan.esperanza!=null) L.push(`VALOR solo-TP1 ${plan.rMin>=0?"+":""}${plan.rMin.toFixed(2)}R · hasta-TP2 ${plan.rMed>=0?"+":""}${plan.rMed.toFixed(2)}R · completa ${plan.rMax>=0?"+":""}${plan.rMax.toFixed(2)}R · esperanza ${plan.esperanza>=0?"+":""}${plan.esperanza.toFixed(3)}R con stop respetado / ${plan.esperanzaSinStop.toFixed(3)}R con su pérdida media histórica de 1.69R`);
    }
    if(plan.qty) L.push(`SIZING ${plan.qty} ${SYM} · nocional ${plan.notional.toFixed(0)} · ${plan.lev}x (máx por stop ${plan.levStop.toFixed(1)}x, bracket ${plan.br.seq} MMR ${(plan.br.mmr*100).toFixed(3)}%) · margen ${plan.margen.toFixed(0)} · liq teórica ${plan.liq?f(plan.liq):"?"} colchón ${plan.colchon?plan.colchon.toFixed(1):"?"}% · fricción ${plan.friPct?plan.friPct.toFixed(3):"?"}%`);
    if(plan.cf) L.push(`CONFLUENCIAS ${plan.cf.map(c=>`${c[1]?"✓":"✗"} ${c[0]}`).join(" · ")}`);
    if(plan.avisos&&plan.avisos.length) L.push(`AVISOS ${plan.avisos.join(" · ")}`);
  }
  // UNA sola fuente del veredicto: sin setup ganador NO hay OPERAR, aunque
  // 'bloq' venga vacio (antes el portapapeles afirmaba OPERAR sin setup)
  const ver = !G ? "NO OPERAR (ausencia de setup AUTO)"
            : bloq.length ? "NO OPERAR: "+bloq.join(" | ") : "OPERAR";
  L.push(`VEREDICTO ${ver}`);
  if(LAST.calidad!=null) L.push(`CALIDAD ${LAST.calidad.toFixed(1)}/10`);
  L.push(`\n(datos directos de Binance USD-M desde mi dispositivo, sin intermediarios)`);
  return L.join("\n");
}
$("#cp").onclick=async()=>{
  const t=textoParaClaude();
  try{ await navigator.clipboard.writeText(t); }
  catch(e){ const ta=document.createElement("textarea"); ta.value=t; document.body.appendChild(ta);
    ta.select(); document.execCommand("copy"); ta.remove(); }
  const b=$("#cp"), o=b.textContent;
  b.textContent="✓ copiado — pégalo a Claude"; b.style.color="var(--ok)";
  setTimeout(()=>{b.textContent=o; b.style.color=""},2200);
};

// ───────── avisos: notificación local + pantalla despierta ─────────
// LIMITE HONESTO: sin servidor, algo tiene que estar despierto vigilando. Esto
// vigila mientras la PESTAÑA VIVE. En iOS/Android una pestaña en segundo plano
// se suspende a los pocos minutos: sirve para una sesión activa (dejas el móvil
// con la app abierta), NO para avisarte dormido. Wake Lock mantiene la pantalla
// encendida mientras dure la sesión para que el polling no muera.
let AVISOS=false, WAKE=null, ULTIMO_VER=null, ZONA_AVISADA=false;
async function toggleAvisos(){
  const info=$("#alinfo"), b=$("#al");
  if(AVISOS){ AVISOS=false; if(WAKE){ try{await WAKE.release()}catch(e){} WAKE=null; }
    b.textContent="🔔 Avisarme"; b.style.color=""; info.style.display="none"; return; }
  if(!("Notification" in window)){
    info.style.display="block";
    info.innerHTML='<span class="wa">Este navegador no soporta notificaciones. En iPhone: añade la app a la pantalla de inicio y ábrela desde ahí.</span>';
    return; }
  let perm=Notification.permission;
  if(perm==="default") perm=await Notification.requestPermission();
  if(perm!=="granted"){
    info.style.display="block";
    info.innerHTML='<span class="wa">Permiso denegado. Actívalo en los ajustes del navegador para este sitio.</span>';
    return; }
  AVISOS=true; b.textContent="🔔 Vigilando"; b.style.color="var(--ok)";
  try{ if("wakeLock" in navigator) WAKE=await navigator.wakeLock.request("screen"); }catch(e){}
  info.style.display="block";
  info.innerHTML=`Te aviso en cuanto el veredicto pase a <b>OPERAR</b> o el precio toque una zona vigilada.
    <span class="wa">Funciona mientras esta pestaña siga viva</span> — si el móvil la suspende, deja de vigilar.
    ${WAKE?"Pantalla mantenida encendida.":""}`;
}
// re-adquirir el wake lock al volver a la pestaña (el SO lo suelta al ocultarla)
document.addEventListener("visibilitychange", async()=>{
  if(AVISOS && !document.hidden && "wakeLock" in navigator && !WAKE){
    try{ WAKE=await navigator.wakeLock.request("screen"); }catch(e){} }
});
function avisar(titulo, cuerpo){
  if(!AVISOS || Notification.permission!=="granted") return;
  try{ const n=new Notification(titulo,{body:cuerpo, tag:"perp-"+SYM, renotify:true,
        icon:"data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>"});
    n.onclick=()=>{ window.focus(); n.close(); };
  }catch(e){}
  try{ navigator.vibrate && navigator.vibrate([220,90,220]); }catch(e){}
}
$("#al").onclick=toggleAvisos;

// ───────────────────────────── UI ─────────────────────────────
// Linea de cierre de cada tarjeta: que significa ESTO para el trade de hoy.
// Sin esto la app era un volcado de metricas que no se cruzaban entre si.
const stopPctDe = p => (p.stopPct||0)/100;
// ═══════ TU SESIÓN — lo único que la app no puede leer de Binance ═══════
// De tu historial 14-jun → 10-jul (206 cierres):
//   · la operación que va DESPUÉS de una pérdida te deja −37.80 USDT de promedio.
//     Son 91 casos y −3,440 acumulados. La que va después de una ganancia te deja
//     +14.61. El "revancha" no es una sensación tuya, está en el estado de cuenta.
//   · por hora (CST): 23:00 −1,873 · 04:00 −627 · 21:00 −618 · 00:00 −220 · 07:00 −168,
//     contra 19:00 +1,094 y 14:00 +634.
//   · el NÚMERO de operaciones al día no predice nada: tus tres días verdes tuvieron
//     37, 36 y 41 cierres, y los rojos 23, 30 y 21. Lo que predice es el TAMAÑO de la
//     pérdida. Por eso lo que se cuenta aquí son "veces lo que arriesgas", no trades.
// Nada de esto bloquea: avisa, con el número delante.
const HORAS_ROJAS  = {23:-1873, 4:-627, 21:-618, 0:-220, 7:-168};
const HORAS_VERDES = {19:1094, 14:634};

// La jornada NO corta a medianoche: cortando a las 00:00 se borraban la racha y el
// tope del día justo en mitad de tu peor bloque horario (23:00 −1,873 y 00:00 −220).
// Corta a las 08:00 CST, que es el único punto que deja FUERA todas tus franjas
// malas — 21:00, 23:00, 00:00, 04:00 y 07:00 caen dentro de la misma jornada, así
// que una racha nocturna sigue contando por la mañana en vez de borrarse sola.
// Coincide además con la apertura de Nueva York, que es cuando empieza de verdad
// una sesión nueva para ti.
const claveDia = t => "ses:" + new Date(t - 14*3600e3).toISOString().slice(0,10);

function leerSesion(now){
  let s=null;
  try{ s=JSON.parse(localStorage.getItem(claveDia(now.getTime()))||"null"); }catch(e){}
  // no basta con que el JSON parsee: si 'ops' no es una lista de números, cualquier
  // cuenta de más abajo revienta el render entero y te deja la pantalla colgada
  if(!s || !Array.isArray(s.ops)) return {ops:[]};
  return {ops: s.ops.filter(o=>o && typeof o.r==="number" && isFinite(o.r)
                                && typeof o.t==="number" && isFinite(o.t))};
}
function guardarSesion(s){
  try{ localStorage.setItem(claveDia(Date.now()), JSON.stringify(s)); return true; }
  catch(e){ alert("No se pudo guardar el registro: "+e.message
    +"\n\nLos avisos de racha y del tope del día seguirán en cero hasta que se resuelva."); return false; }
}
// Repintar SIN volver a pegarle a Binance: el candado anti-solape vive en tick(),
// así que llamar a correr() desde un botón podía lanzar dos corridas a la vez y
// duplicar el consumo de rate-limit. Con LAST ya tenemos los datos.
function repintar(){
  if(LAST && LAST.D) render(LAST.D, LAST.eq, LAST.estilo, ESTILOS[LAST.estilo],
                            LAST.symFull||(LAST.sym+"USDT"), LAST.marUsr, LAST.levUsr);
  else tick(true);
}
function registrar(r){
  const s=leerSesion(new Date());
  s.ops.push({r, t:Date.now()});
  if(guardarSesion(s)) repintar();
}
function borrarSesion(){
  try{ localStorage.removeItem(claveDia(Date.now())); }catch(e){}
  repintar();
}
function resumenSesion(now){
  const ops=leerSesion(now).ops;
  let rTot=0; ops.forEach(o=>rTot+=o.r);
  let racha=0; for(let i=ops.length-1;i>=0;i--){ if(ops[i].r<0) racha++; else break; }
  const ult=ops[ops.length-1];
  return {ops, rTot, racha, ult, mins: ult ? (Date.now()-ult.t)/60000 : null,
          h: cstH(now.getTime())};
}
function alertasDeRiesgo(now){
  const {ops,rTot,racha,ult,mins,h}=resumenSesion(now);
  const A=[];
  if(ult && ult.r<0 && mins<20) A.push(["mal","⏸",
    "Acabas de perder — no entres todavía",
    `Han pasado ${mins.toFixed(0)} minutos. En tu historial, la operación que va justo
     después de una pérdida te deja <b>−37.80 USDT</b> de promedio: 91 veces, −3,440 en total.
     Es lo más caro que haces. Deja pasar 20 minutos como mínimo.`]);
  // El tope del día es distinto de una racha: por eso tiene su propia tarjeta y no
  // el mismo tono. Antes racha 2 y racha 5 se veían exactamente igual.
  if(racha>=4 || rTot<=-6) A.push(["mal","⛔",
    racha>=4 ? `${racha} pérdidas seguidas — según tu regla, hoy se acabó`
             : `${rTot.toFixed(1)}× en el día — según tu regla, hoy se acabó`,
    `Tu regla es explícita: <b>4 seguidas o −6× y se cierra el día</b>. No es un consejo de la app,
     es lo que tú escribiste. El 6 de julio, sin este freno, el día terminó en
     <b>−1,874 USDT</b>. Cierra la plataforma.`]);
  // Toda la escalera del día es UNA sola cadena: si ya saltó el "se acabó", no puede
  // salir debajo un "todavía no es el −3× que cierra el día" contradiciéndolo.
  else if(racha>=2) A.push(["mal","✖",
    `Llevas ${racha} pérdidas seguidas`,
    `Tu propia regla dice: 2 seguidas → bajas el tamaño a 0.75%; 4 seguidas o −6× → se acabó
     el día. Vas en ${rTot.toFixed(1)}×.`]);
  else if(rTot<=-3) A.push(["mal","▼",
    `Llevas ${rTot.toFixed(1)}× hoy`,
    `A −6× tu regla cierra el día. Los días rojos de junio y julio se hicieron así:
     el 6 de julio terminó en <b>−1,874 USDT</b>.`]);
  else if(rTot<=-1.5 && ops.length>=3) A.push(["ojo","▽",
    `El día se está torciendo: ${rTot.toFixed(1)}×`,
    `Todavía no es el −3× que baja el tamaño ni el −6× que cierra el día, pero la dirección
     ya está marcada. Aquí es donde toca bajar el tamaño, no subirlo.`]);
  if(HORAS_ROJAS[h]!=null) A.push(["ojo","🕐",
    `Las ${String(h).padStart(2,"0")}:00 son mala hora para ti`,
    `Históricamente esta hora te ha costado <b>${HORAS_ROJAS[h]} USDT</b>. No quiere decir que
     no se pueda: quiere decir que el listón sube.`]);
  if(!A.length) return "";
  return A.map(a=>`<div class="card" style="border-color:${a[0]==="mal"?"rgba(239,77,90,.34)":"rgba(240,169,46,.32)"}">
    <div style="display:flex;gap:9px;align-items:flex-start">
      <span style="font-size:15px">${a[1]}</span>
      <div><b style="font-size:13.5px">${a[2]}</b><div class="sub" style="margin-top:2px">${a[3]}</div></div>
    </div></div>`).join("");
}
function tarjetaSesion(now){
  const {ops,rTot,racha,h}=resumenSesion(now);
  const verde=HORAS_VERDES[h]!=null, roja=HORAS_ROJAS[h]!=null;
  return `<div class="card"><h2>Tu día · son las ${String(h).padStart(2,"0")}:00${
    verde?' · <span class="up">buena franja para ti</span>':roja?' · <span class="dn">mala franja para ti</span>':''}</h2>
    ${kv("operaciones cerradas", `${ops.length}`)}
    ${kv("cómo vas", `<b class="${rTot>0?'up':rTot<0?'dn':'nd'}">${rTot>=0?"+":""}${rTot.toFixed(1)}×</b>`,
      "en veces lo que arriesgas, no en dinero: así se compara un día con otro")}
    ${kv("pérdidas seguidas", `<span class="${racha>=2?'dn':'nd'}">${racha}</span>`)}
    <div style="display:flex;gap:5px;margin-top:8px">
      <button class="go" style="background:var(--card2);border-color:rgba(37,194,129,.45);color:var(--ok);font-size:12px;padding:8px 4px" onclick="registrar(1)">gané +1×</button>
      <button class="go" style="background:var(--card2);border-color:rgba(239,77,90,.45);color:var(--no);font-size:12px;padding:8px 4px" onclick="registrar(-1)">perdí −1×</button>
      <button class="go" style="background:var(--card2);border-color:var(--line);color:var(--dim);font-size:12px;padding:8px 4px" onclick="registrar(0)">salí en cero</button>
    </div>
    ${cruce(`Marca cada cierre y la app deja de estar ciega a lo único que no puede ver de Binance:
      cómo vas tú hoy. Es lo que activa los avisos de racha y del tope del día.
      <a href="#" onclick="borrarSesion();return false" style="color:var(--dim2)">reiniciar el día</a>
      <br><br>Dato de tu historial que conviene tener presente: el número de operaciones al día
      <b>no</b> predice si acabas en verde — tus tres mejores días tuvieron 37, 36 y 41 cierres y los
      peores 23, 30 y 21. Lo que sí predice es el tamaño de la pérdida: la tuya promedió
      <b>38.10 USDT</b> contra los 22.50 que decías arriesgar. Perdías más de lo que creías.`,"")}
  </div>`;
}

const cruce=(txt,tono)=>`<div class="cruce ${tono||""}">${txt}</div>`;
const kv=(k,v,s)=>`<div class="kv"><span class="k">${k}</span><span class="v">${v}</span></div>${s?`<div class="sub" style="text-align:right">${s}</div>`:""}`;
const vcard=(cls,t,s,li)=>`<div class="verd ${cls}"><div class="t">${t}</div><div class="s">${s}</div>${
  li?`<ul>${li.map(x=>`<li>${x}</li>`).join("")}</ul>`:""}</div>`;

$("#chips").innerHTML=MONEDAS.map(m=>{
  const [t]=tierDe(m);
  return `<div class="chip ${m===SYM?"on":""} ${t==="T1"?"t1":""}" data-m="${m}">${m}${t==="T1"?" ★":""}</div>`;
}).join("");
$("#chips").onclick=e=>{ const c=e.target.closest(".chip"); if(!c) return;
  SYM=c.dataset.m; TICK=null;              // filtros del nuevo símbolo
  ULTIMO_VER=null; ZONA_AVISADA=false;     // no arrastrar el estado de avisos
  document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x===c));
  tick(true); };
$("#go").onclick=()=>tick(true);
$("#st").onchange=()=>tick(true);
for(const k of ["eq","mar","lv"]){
  const el=$("#"+(k==="lv"?"lv":k));
  el.onchange=()=>localStorage.setItem(k, el.value);
  const g=localStorage.getItem(k); if(g) el.value=g;
}
if(localStorage.getItem("st")) $("#st").value=localStorage.getItem("st");

// Auto-refresh adaptativo. Un solo temporizador, sin solapes.
//  · scalp 30s / intraday 75s (el scalp necesita más frecuencia)
//  · con avisos activos sigue aunque la pestaña esté oculta (mientras el SO la
//    deje viva); sin avisos solo refresca visible, para no gastarte datos
//  · ~35 KB por corrida -> scalp ≈ 4 MB/h, intraday ≈ 1.7 MB/h
let corriendo=false;
async function tick(forzar){
  if(corriendo) return;                              // nunca dos corridas a la vez
  if(!forzar && document.hidden && !AVISOS) return;
  corriendo=true;
  try{ await correr(); } catch(e){}
  finally{ corriendo=false; programar(); }
}
let temporizador=null;
function programar(){
  clearTimeout(temporizador);
  const periodo=($("#st").value==="scalp"?30:75)*1000;
  temporizador=setTimeout(()=>tick(false), periodo);
}
tick(true);
</script>
