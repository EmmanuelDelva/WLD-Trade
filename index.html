<script>
"use strict";
// ═══════════════════════════════════════════════════════════════════════════
// Perp WLD — operativa scalp/intraday sin servidor.

// Binance nunca ha baneado ni geo-bloqueado. Cero hosting, cero costo.

// ═══════════════════════════════════════════════════════════════════════════
const API = "https://fapi.binance.com";

// [capNocional, MMR, cum, maxLev] · verificado 2026-07-24 contra el espejo
// publico de Binance. Sin CORS en ese endpoint -> se embebe. Revisar cada
// ~3 meses: si Binance cambia brackets, el apalancamiento sugerido cambia.
const BRACKETS = {"WLDUSDT":[[20000,0.01,0,75],[200000,0.015,100,50],[1000000,0.02,1100,25],[2000000,0.025,6100,20]],"BTCUSDT":[[300000,0.004,0,150],[800000,0.005,300,100],[3000000,0.0065,1500,75],[12000000,0.01,12000,50]],"ETHUSDT":[[300000,0.004,0,150],[800000,0.005,300,100],[3000000,0.0065,1500,75],[12000000,0.01,12000,50]],"SOLUSDT":[[50000,0.005,0,100],[400000,0.0065,75,75],[1000000,0.01,1475,50],[4000000,0.02,11475,25]],"FETUSDT":[[5000,0.01,0,75],[10000,0.015,25,50],[50000,0.02,75,25],[100000,0.025,325,20]],"GMTUSDT":[[5000,0.015,0,50],[10000,0.025,50,20],[20000,0.05,300,10],[50000,0.1,1300,5]],"1000SHIBUSDT":[[25000,0.0065,0,75],[150000,0.01,87.5,50],[200000,0.015,837.5,40],[800000,0.02,1837.5,25]],"1000FLOKIUSDT":[[5000,0.01,0,75],[10000,0.015,25,50],[50000,0.02,75,25],[100000,0.025,325,20]],"GALAUSDT":[[5000,0.01,0,75],[10000,0.015,25,50],[25000,0.02,75,25],[50000,0.025,200,20]]};

// Tiers de la skill: riesgo, calidad minima, tope de lev, confluencias, liquidez
const TIERS = {
  T1:{m:["WLD"],              r:1.5, rmax:2.0, cal:7, lev:75, conf:3, core:false, liq:0},
  T2:{m:["BTC","ETH","SOL","FET"], r:1.0, rmax:1.5, cal:7, lev:25, conf:2, core:false, liq:50e6},
  T3:{m:["GMT","1000SHIB","1000FLOKI","GALA"], r:0.75, rmax:1.0, cal:8, lev:10, conf:4, core:true, liq:10e6}
};
const ESTILOS = {
  scalp:   {tfs:["15m","5m","1m"], rr:1.3, cal:8, maxH:0.5},
  intraday:{tfs:["1h","15m","5m"], rr:2.0, cal:7, maxH:4}
};
const FUND_OK = 0.03, FUND_NO = 0.08, COLCHON = 0.25;
// Granularidad: el tick no debe pasar del 25% del ATR del TF (si lo pasa, el
// simbolo no puede expresar un stop con precision) y el stop debe medir al menos
// 8 ticks (error de cuantizacion ±6% de R, aceptable).
// El gate anterior de 20 ticks FIJOS era incompatible con WLD por construccion:
// su stop minimo de 0.5 ATR son 6.9 ticks. Bloqueaba absolutamente todo.
const TICKS_MIN = 8, TICK_ATR_MAX = 0.25;

// ── TEMPORALIDADES ──
// TFS_OP  = las que usan los detectores y la nota de calidad (necesitan EMA200).
// TFS_VER = solo para ver hacia dónde apunta cada una.
// 45m y 3h NO existen en Binance: se arman agregando 3 velas de 15m y de 1h.
const TFS_OP  = ["1m","5m","15m","1h","4h","1d"];
const TFS_VER = ["3m","30m","2h","8h","12h","1w","1M"];
const TF_VISTA = ["1m","3m","5m","15m","30m","45m","1h","2h","3h","4h","8h","12h","1d","1w","1M"];
const MS = {"1m":6e4,"3m":18e4,"5m":3e5,"15m":9e5,"30m":18e5,"45m":27e5,"1h":36e5,
            "2h":72e5,"3h":108e5,"4h":144e5,"8h":288e5,"12h":432e5,"1d":864e5,
            "1w":6048e5,"1M":2592e6};

// Agrega velas nativas en bloques anclados al epoch, para que las fronteras sean
// las mismas entre recargas (no dependen de dónde empezó el array que llegó).
function agrupa(v, ms){
  if(!v || v.length<2) return [];
  const paso = v[1].t - v[0].t;
  const porBloque = Math.round(ms/paso);
  const out=[]; let cur=null;
  for(const k of v){
    const ini = Math.floor(k.t/ms)*ms;
    if(!cur || cur.t!==ini){ cur={t:ini,o:k.o,h:k.h,l:k.l,c:k.c,vol:k.vol,tbv:k.tbv,n:1}; out.push(cur); }
    else { cur.h=Math.max(cur.h,k.h); cur.l=Math.min(cur.l,k.l); cur.c=k.c;
           cur.vol+=k.vol; cur.tbv+=k.tbv; cur.n++; }
  }
  // el primer bloque suele venir cortado a media vela: no es comparable
  if(out.length && out[0].n<porBloque) out.shift();
  return out;
}
// ── TOPE DE TAMAÑO (fijado por Emmanuel, 2026-07-24) ──
// 250 USD de margen como máximo, con hasta 75x.
// Sustituye la escalera por nocional de protocolo-sizing.md:15-17 (50x hasta
// 1500 USD de nocional, 25x hasta 3000, 10x por encima), calibrada por slippage
// de orderbook y que topaba WLD en 25x.
// NO sustituye levMaxPorStop: ese techo no es preferencia sino física — por
// encima de él la liquidación cae ANTES que el stop y te sacan sin que el stop
// llegue a ejecutarse.
const MARGEN_MAX = 250, LEV_MAX_USR = 75;
// Evento calendarizado (SKILL.md): sizing -50% en ventana, sin abrir +-30min
// ── EVENTOS CALENDARIZADOS ──
// Vacío A PROPÓSITO, no por olvido. Verificado el 28-jul-2026 en la fuente primaria
// (world.org) y en DefiLlama: WLD NO tiene unlocks de cliff. Los tokens se liberan
// a diario de forma lineal, sin saltos. Lo del 24-jul-2026 no fue un unlock: fue una
// BAJA del 43% en la TASA diaria de emisión (comunidad de 3.2M a 1.6M WLD/día,
// equipo e inversores de 1.9M a 1.3M), y ya pasó. No hay ninguna otra fecha anunciada
// hasta el tramo final, alrededor de julio de 2038.
//
// O sea: para WLD no existe una fecha que justifique recortar el tamaño. Dejar aquí
// la ventana vieja era peor que dejarlo vacío — parecía cubierto y no cubría nada.
//
// El mecanismo SIGUE VIVO para lo que sí tiene fecha: dato macro, decisión de la Fed,
// listado, hard fork. Para activarlo:
//   WLD:{n:"qué es", ini:Date.UTC(a,m-1,d,h), fin:..., ts:momento exacto}
// Dentro de [ini,fin] el tamaño se recorta a la mitad; a ±30 min de `ts` no se abre.
const EVENTOS = {};
const MONEDAS = ["WLD","BTC","ETH","SOL","FET","GMT","1000SHIB","1000FLOKI","GALA"];

const $ = s => document.querySelector(s);
let SYM = localStorage.getItem("sym") || "WLD";
let timer = null;

// ───────────────────────────── capa de datos ─────────────────────────────
// Binance-o-nada: si falla, se dice. Jamas otro exchange, jamas un dato viejo
// presentado como fresco.
async function get(path, params) {
  const qs = params ? "?" + new URLSearchParams(params) : "";
  const r = await fetch(API + path + qs, {cache:"no-store"});
  if (!r.ok) {
    const txt = await r.text().catch(()=> "");
    throw new Error(`HTTP ${r.status} en ${path}${r.status===418||r.status===429?" (rate-limit)":""} ${txt.slice(0,90)}`);
  }
  return r.json();
}

// ───────────────────────────── indicadores ─────────────────────────────
// TODO sobre velas CERRADAS. La vela viva solo sirve como precio.
const cerradas = v => v.length > 1 ? v.slice(0,-1) : v;

function ema(a,n){ if(a.length<n) return null;
  let k=2/(n+1), e=a.slice(0,n).reduce((x,y)=>x+y,0)/n;
  for(let i=n;i<a.length;i++) e=a[i]*k+e*(1-k); return e; }

function rsi(c,n=14){ if(c.length<n+1) return null;
  let g=0,l=0; for(let i=1;i<=n;i++){const d=c[i]-c[i-1]; d>0?g+=d:l-=d;}
  let ag=g/n, al=l/n;
  for(let i=n+1;i<c.length;i++){const d=c[i]-c[i-1];
    ag=(ag*(n-1)+Math.max(d,0))/n; al=(al*(n-1)+Math.max(-d,0))/n;}
  return al===0?100:100-100/(1+ag/al); }

function atr(v,n=14){ if(v.length<n+1) return null;
  const t=[]; for(let i=1;i<v.length;i++)
    t.push(Math.max(v[i].h-v[i].l, Math.abs(v[i].h-v[i-1].c), Math.abs(v[i].l-v[i-1].c)));
  return t.slice(-n).reduce((x,y)=>x+y,0)/n; }

function swings(v,k=3){ const hi=[],lo=[];
  for(let i=k;i<v.length-k;i++){ let ah=true,al=true;
    for(let j=i-k;j<=i+k;j++){ if(j===i)continue;
      if(v[j].h>v[i].h)ah=false; if(v[j].l<v[i].l)al=false; }
    if(ah)hi.push([i,v[i].h]); if(al)lo.push([i,v[i].l]); }
  return [hi,lo]; }

// ───────────────────────────── setups AUTO ─────────────────────────────
// Solo los 6 detectables desde OHLCV. Los SEMI (CHoCH+OB, OB-HTF, Three-Drives,
// Range-HVN) y los MANUAL (Wyckoff) NO se inventan: exigen que marques estructura.
function detFVG(v){
  for(let i=v.length-3;i>Math.max(v.length-12,1);i--){
    const a=v[i-1], c=v[i+1], post=v.slice(i+2);
    if(a.h<c.l){ const w=c.l-a.h;
      const pen = post.length&&w ? Math.max(0,(c.l-Math.min(...post.map(x=>x.l)))/w) : 0;
      if(pen<=0.5) return {s:"FVG-entrada",d:"long",core:true,prio:3,z:[a.h,c.l],mit:pen,
        n:`FVG alcista ${f(a.h)}–${f(c.l)}, ${(pen*100).toFixed(0)}% mitigado`}; }
    if(a.l>c.h){ const w=a.l-c.h;
      const pen = post.length&&w ? Math.max(0,(Math.max(...post.map(x=>x.h))-c.h)/w) : 0;
      if(pen<=0.5) return {s:"FVG-entrada",d:"short",core:true,prio:3,z:[c.h,a.l],mit:pen,
        n:`FVG bajista ${f(c.h)}–${f(a.l)}, ${(pen*100).toFixed(0)}% mitigado`}; }
  } return null; }

function detSweep(v){ const [hi,lo]=swings(v.slice(0,-1)); const u=v[v.length-1];
  if(hi.length){ const n=Math.max(...hi.slice(-4).map(x=>x[1]));
    if(u.h>n && u.c<n && (u.h-u.c)>0.55*(u.h-u.l))
      return {s:"Sweep+Reclaim",d:"short",core:true,prio:1,z:[n,u.h],
        n:`barrió máximo ${f(n)} y cerró dentro`}; }
  if(lo.length){ const n=Math.min(...lo.slice(-4).map(x=>x[1]));
    if(u.l<n && u.c>n && (u.c-u.l)>0.55*(u.h-u.l))
      return {s:"Sweep+Reclaim",d:"long",core:true,prio:1,z:[u.l,n],
        n:`barrió mínimo ${f(n)} y cerró dentro`}; }
  return null; }

function detBOS(v,a){ if(!a) return null;
  const [hi,lo]=swings(v.slice(0,-6)); const rec=v.slice(-6), u=v[v.length-1], tol=0.3*a;
  if(hi.length){ const n=Math.max(...hi.slice(-3).map(x=>x[1]));
    if(rec.slice(0,-1).some(x=>x.c>n) && u.l<=n+tol && u.c>n)
      return {s:"BOS+Retest",d:"long",core:true,prio:2,z:[n-0.25*a,n+tol],
        n:`BOS alcista sobre ${f(n)}, en retest`}; }
  if(lo.length){ const n=Math.min(...lo.slice(-3).map(x=>x[1]));
    if(rec.slice(0,-1).some(x=>x.c<n) && u.h>=n-tol && u.c<n)
      return {s:"BOS+Retest",d:"short",core:true,prio:2,z:[n-tol,n+0.25*a],
        n:`BOS bajista bajo ${f(n)}, en retest`}; }
  return null; }

function detEQ(v){ const [hi,lo]=swings(v.slice(0,-1)); const u=v[v.length-1];
  for(const [pv,d] of [[hi,"short"],[lo,"long"]]){ if(pv.length<2) continue;
    const ps=pv.slice(-4).map(x=>x[1]);
    for(let i=0;i<ps.length-1;i++){ const [a,b]=[ps[i],ps[i+1]];
      if(Math.abs(a-b)/Math.max(a,b)>=0.001) continue;
      const n=(a+b)/2;
      if(d==="short"&&u.h>n&&u.c<n) return {s:"EQH/EQL-Sweep",d,core:false,prio:4,z:[n,u.h],n:`EQH ${f(n)} barrido`};
      if(d==="long"&&u.l<n&&u.c>n)  return {s:"EQH/EQL-Sweep",d,core:false,prio:4,z:[u.l,n],n:`EQL ${f(n)} barrido`}; } }
  return null; }

function detMR(v,e200,vwap,a){ // Mean-Reversion SOLO en rango (gate de regimen)
  const u=v[v.length-1], r=rsi(v.map(x=>x.c)), ref=vwap||e200;
  if(!ref||r===null||!a) return null;
  const w=v.slice(-20), anc=Math.max(...w.map(x=>x.h))-Math.min(...w.map(x=>x.l));
  if(anc>4*a) return null;                      // hay tendencia: no es mean-reversion
  const dv=(u.c-ref)/ref;
  if(dv<-0.02&&r<30) return {s:"Mean-Reversion",d:"long",core:false,prio:5,z:[u.l,u.c],
    n:`${(dv*100).toFixed(2)}% bajo referencia, RSI ${r.toFixed(0)}`};
  if(dv>0.02&&r>70)  return {s:"Mean-Reversion",d:"short",core:false,prio:5,z:[u.c,u.h],
    n:`+${(dv*100).toFixed(2)}% sobre referencia, RSI ${r.toFixed(0)}`};
  return null; }

// ── Momentum-NY-Open (banco-setups.md #9) ──
// Rango pre-NY 00:00-07:59 CST y break con cuerpo > 60% del ATR. En su ventana
// original (08:00-11:59 CST) es EXACTAMENTE el setup del banco.
// CST desde UTC, NUNCA desde la hora local del aparato: Emmanuel opera desde el
// celular y viaja, así que el dispositivo puede estar en otro huso y el resto de
// la app (sesionCST) ya calcula así.
const cstH   = ms => (new Date(ms).getUTCHours()+18)%24;
const cstDia = ms => new Date(ms-6*3600e3).toISOString().slice(0,10);

function detMomentumNY(v, a, ahora){
  if(!a) return null;
  const h=cstH(ahora.getTime());
  if(h<8||h>=12) return null;
  const hoy=cstDia(ahora.getTime());
  // BUG QUE ESTO CORRIGE: antes el filtro hacía new Date(x.t-6h).getHours(), que
  // sobre un aparato ya en CST restaba SEIS HORAS DE MÁS. Resultado: el "rango
  // pre-NY" se estiraba hasta las 13:59 CST e incluía la propia vela que debía
  // romperlo, así que u.c>hi y u.c<lo eran imposibles por construcción y el
  // detector no disparó nunca desde que lo escribí.
  const pre=v.filter(x=>cstDia(x.t)===hoy && cstH(x.t)<8);
  if(pre.length<8) return null;
  const hi=Math.max(...pre.map(x=>x.h)), lo=Math.min(...pre.map(x=>x.l));
  const u=v[v.length-1], cuerpo=Math.abs(u.c-u.o);
  if(cuerpo<0.6*a) return null;
  if(u.c>hi) return {s:"Momentum-NY-Open",d:"long",core:false,prio:4,z:[hi*0.999,hi*1.002],
    n:`break del rango pre-NY ${f(lo)}–${f(hi)} con cuerpo ${(cuerpo/a).toFixed(1)} ATR`};
  if(u.c<lo) return {s:"Momentum-NY-Open",d:"short",core:false,prio:4,z:[lo*0.998,lo*1.001],
    n:`break bajista del rango pre-NY ${f(lo)}–${f(hi)} con cuerpo ${(cuerpo/a).toFixed(1)} ATR`};
  return null;
}

// ── Impulso + Pullback (continuación de tendencia) ──
// NO está en el banco de 12 como tal: es la generalización de "BOS+Retest" cuando
// el retest llega a la EMA20 en vez de al nivel roto. Se marca EXTRA para que sea
// visible que no es un setup canónico y exige calidad de oportunista (≥8).
function detPullback(v, a){
  if(!a || v.length<60) return null;
  const cs=v.map(x=>x.c), e20=ema(cs,20), e50=ema(cs,50);
  if(!e20||!e50) return null;
  const u=v[v.length-1], px=u.c;
  // tendencia definida: EMA20 y EMA50 alineadas y separadas > 0.3 ATR
  const sep=(e20-e50)/a;
  if(Math.abs(sep)<0.3) return null;
  const alcista=sep>0;
  // impulso reciente: el rango de las ultimas 12 velas supera 2.5 ATR
  const w=v.slice(-12), rango=Math.max(...w.map(x=>x.h))-Math.min(...w.map(x=>x.l));
  if(rango<2.5*a) return null;
  // pullback: el precio volvio a menos de 0.5 ATR de la EMA20, DESDE el lado correcto
  const dist=(px-e20)/a;
  if(alcista && dist>-0.6 && dist<0.5 && u.c>u.o)
    return {s:"Impulso+Pullback",d:"long",core:false,prio:6,extra:true,z:[e20-0.3*a,e20+0.2*a],
      n:`tendencia alcista (EMA20/50 +${sep.toFixed(1)} ATR), pullback a EMA20 con vela de rechazo`};
  if(!alcista && dist<0.6 && dist>-0.5 && u.c<u.o)
    return {s:"Impulso+Pullback",d:"short",core:false,prio:6,extra:true,z:[e20-0.2*a,e20+0.3*a],
      n:`tendencia bajista (EMA20/50 ${sep.toFixed(1)} ATR), pullback a EMA20 con vela de rechazo`};
  return null;
}

// Prioridad POR TF de entrada (banco-setups.md), no ranking global.
// PARIDAD EXACTA con PRIO_POR_TF del disparador Python: "Momentum-NY-Open" ocupa
// su puesto AUNQUE el detector no exista aquí — si se omite, FVG-entrada sube un
// índice en 1m/5m y eso llegó a elegir un setup y una DIRECCIÓN distintos a los
// del motor auditado (reproducido: BTC scalp JS=SHORT vs PY=LONG).
const PRIO_TF = {"1m":["Mean-Reversion","Momentum-NY-Open","FVG-entrada"],
  "5m":["Mean-Reversion","Momentum-NY-Open","FVG-entrada"],
  "15m":["Sweep+Reclaim","BOS+Retest","FVG-entrada","EQH/EQL-Sweep","Momentum-NY-Open","Impulso+Pullback"],
  "1h":["BOS+Retest","Sweep+Reclaim","FVG-entrada","EQH/EQL-Sweep","Impulso+Pullback"],
  "4h":["BOS+Retest","Sweep+Reclaim","FVG-entrada","Impulso+Pullback"]};

// ───────────────────────────── utilidades ─────────────────────────────
let TICK=null, STEP=null, MINNOT=5;
// Formatea SOBRE EL TICK real: redondear a 0.1 todo precio >=1000 mostraba
// niveles NO ejecutables (SOL tiene tick 0.01). Sin tick conocido, cae a algo seguro.
// Decimales EXACTOS que hacen falta para escribir el tick. Por logaritmos fallaba
// por los dos lados: el "+0.001" daba un decimal de más en los ticks que son
// potencia de 10 (0.0001 → 5 decimales, y un precio con un cero de sobra se lee
// como si no estuviera en la rejilla en la que puedes poner la orden), y un ceil
// pelón se queda corto con mantisa 2.5 (tick 0.25 → 1 decimal, que redondearía
// 1.25 a "1.3", un precio que Binance no acepta). Contar los decimales de la
// representación decimal del número no falla en ningún caso.
function decDeTick(t){
  if(!(t>0)) return null;
  const s=String(t);
  const e=s.match(/e-(\d+)$/i);                       // 1e-8, 2.5e-7…
  if(e){ const m=s.split(/e-/i)[0], d=m.indexOf(".");
    return +e[1] + (d<0?0:m.length-d-1); }
  const d=s.indexOf(".");
  return d<0 ? 0 : s.length-d-1;
}
const f = x => { if(x==null||!isFinite(x)) return "—";
  if(TICK>0){
    const dt=decDeTick(TICK);
    // Los precios que SÍ están en la rejilla del tick (entrada, stop, objetivos)
    // se imprimen con los decimales exactos del tick: ni un cero de sobra.
    // Pero hay números que NO tienen por qué caer en la rejilla — el precio del
    // índice, por ejemplo — y a esos no se les puede recortar un dígito real.
    // Así que si el número necesita más decimales para escribirse tal cual, se le
    // dan (hasta dos más), y si no, se queda con los del tick.
    const s=x.toFixed(8).replace(/0+$/,"");
    const i=s.indexOf(".");
    const dn=i<0?0:s.length-i-1;
    const dec=Math.max(0, Math.min(8, Math.max(dt, Math.min(dn, dt+2))));
    return x.toFixed(dec); }
  return Math.abs(x)>=1 ? x.toFixed(4) : x.toPrecision(5); };
const q = (x,p) => p ? Math.round(x/p)*p : x;
const pct = x => (x>=0?"+":"")+x.toFixed(2)+"%";
const tfH = t => ({"1m":1/60,"5m":1/12,"15m":.25,"1h":1,"4h":4,"1d":24})[t]||1;
// minutos -> texto legible ("8 min", "1h 20m", "3.2h")
const minsTxt = m => { if(m==null||!isFinite(m)) return "—";
  if(m<1) return "menos de 1 min"; if(m<60) return `${Math.round(m)} min`;
  const h=Math.floor(m/60), r=Math.round(m%60);
  return h<6 ? `${h}h${r?" "+r+"m":""}` : `${(m/60).toFixed(1)}h`; };
let LAST_ETA=null;

function tierDe(base){
  for(const [k,c] of Object.entries(TIERS)) if(c.m.includes(base)) return [k,c];
  return ["T3*", TIERS.T3];                     // fuera de watchlist -> mas conservador
}
function bracketDe(sym,not){
  const bs=BRACKETS[sym]; if(!bs) return null;
  for(let i=0;i<bs.length;i++) if(not<=bs[i][0])
    return {seq:i+1,mmr:bs[i][1],cum:bs[i][2],maxLev:bs[i][3]};
  const l=bs[bs.length-1]; return {seq:bs.length,mmr:l[1],cum:l[2],maxLev:l[3]};
}
const levMaxPorStop = (sp,mmr) => 1/(sp/(1-COLCHON)+mmr);
function liqPx(entry,qty,lev,mmr,cum,dir){
  const mar=qty*entry/lev;
  const den = dir==="long" ? qty*(mmr-1) : qty*(mmr+1);
  if(!den) return null;
  return dir==="long" ? (mar+cum-qty*entry)/den : (mar+cum+qty*entry)/den;
}
function slipLibro(libro,not,dir){
  const lado = dir==="long"?libro.asks:libro.bids;
  if(!lado||!lado.length) return [null,false];
  const ref=+lado[0][0]; let falta=not, u=0;
  for(const [p,c] of lado){ const px=+p, cn=+c, val=px*cn;
    if(val>=falta){ u+=falta/px; falta=0; break; }
    u+=cn; falta-=val; }
  if(falta>0) return [null,false];
  return [Math.abs((not/u)/ref-1)*1e4, true];
}
const sesionCST = d => { const h=(d.getUTCHours()+18)%24, dow=(d.getUTCDay()+(d.getUTCHours()<6?6:0))%7;
  if(dow===0||dow===6) return "weekend";
  if(h>=8&&h<12) return "ny_open"; if(h>=12&&h<16) return "ny_tarde";
  if(h>=20||h<4) return "asia"; return "transicion"; };

// ───── rubrica de calidad v1.1 (port de calcular_calidad del Python) ─────
// Sin esto el JS emitia OPERAR sin el gate de calidad minima del tier/estilo,
// que es condicion dura en 10+ reglas de la skill.
function calcularCalidad(setup, tfSig, dir, ls, contra8, atrPct, sesion, conflicto, edadLS){
  const d=[]; let p=0;
  // confluencias de CONTEXTO excluyendo funding y ballenas (tienen componente propio)
  const DOBLES=["funding no adverso","ballenas a favor vs retail"];
  const solo=(setup.cf||[]).filter(c=>!DOBLES.some(x=>c[0].startsWith(x)));
  const req=Math.max(1,solo.length), cum=solo.filter(c=>c[1]).length;
  let v=3*Math.min(cum/req,1); p+=v; d.push(["el mercado te acompaña",v,`${cum} de ${req} señales`]);

  const sg=Object.values(tfSig).filter(x=>x!=null);
  if(sg.length){ const neto=sg.reduce((a,b)=>a+b,0)/sg.length;
    const al=dir==="long"?neto:-neto; v=2*Math.max(0,Math.min(al,1));
    p+=v; d.push(["temporalidades del mismo lado",v,`${neto>=0?"+":""}${neto.toFixed(2)} de alineación`]); }
  else d.push(["temporalidades del mismo lado",0,"sin datos"]);

  const viejas = edadLS!=null && edadLS>90;
  if(ls.tp&&ls.g&&!viejas){ const spr=ls.tp-ls.g, fav=dir==="long"?spr:-spr;
    v=1.5*Math.max(0,Math.min(fav/0.5,1)); p+=v;
    d.push(["los grandes van contigo",v,`${ls.tp.toFixed(2)} vs ${ls.g.toFixed(2)}`]); }
  else d.push(["los grandes van contigo",0, viejas?`serie de ${edadLS.toFixed(0)} min — no cuenta`:"s/d"]);

  if(contra8==null) d.push(["funding",0,"s/d"]);
  else if(contra8<=FUND_OK){ p+=1.5; d.push(["funding",1.5,`${contra8>=0?"+":""}${contra8.toFixed(4)}% base-8h OK`]); }
  else if(contra8<=FUND_NO){ p+=0.6; d.push(["funding",0.6,`${contra8.toFixed(4)}% base-8h ALERTA`]); }
  else d.push(["funding",0,`${contra8.toFixed(4)}% base-8h PROHIBITIVO`]);

  if(atrPct==null) d.push(["se mueve lo suficiente",0,"s/d"]);
  else if(atrPct>=0.2&&atrPct<=3){ p+=1; d.push(["se mueve lo suficiente",1,`ATR ${atrPct.toFixed(2)}% operable`]); }
  else { p+=0.3; d.push(["se mueve lo suficiente",0.3,`ATR ${atrPct.toFixed(2)}% fuera de rango cómodo`]); }

  v=setup.core?1:0.4; p+=v; d.push(["qué tan bueno es el patrón",v,setup.core?"CORE":"oportunista"]);
  // El -2 por "sin baseline" del Python NO se aplica aquí: allí es informativo
  // (puede haberlo o no); en la web es ESTRUCTURAL — nunca hay percentiles — así
  // que restaba 2 puntos fijos a todo y hacía el umbral de calidad inalcanzable.
  // En su lugar se penaliza el setup EXTRA (no canónico del banco).
  if(setup.extra){ p-=1; d.push(["setup fuera del banco de 12",-1,"continuación, no canónico"]); }
  if(sesion==="asia"||sesion==="weekend"){ p-=1; d.push(["sesión de baja liquidez",-1,sesion]); }
  if(conflicto){ p-=1; d.push(["conflicto de dirección entre TFs",-1,"gana el HTF"]); }
  return [Math.max(0,Math.min(10,p)), d];
}

// ───────────────────────────── motor ─────────────────────────────
async function correr(){
  const eq=+$("#eq").value||1500, estilo=$("#st").value, E=ESTILOS[estilo];
  // Emmanuel dimensiona como en Binance: pone MARGEN y X, no un % de riesgo.
  // El riesgo pasa a ser una SALIDA — cuanto acaba arriesgando con ese tamano.
  const marUsr=+$("#mar").value||0, levUsr=+$("#lv").value||0;
  const sym=SYM+"USDT";
  localStorage.setItem("eq",eq); localStorage.setItem("st",estilo); localStorage.setItem("sym",SYM);
  localStorage.setItem("mar",marUsr); localStorage.setItem("lv",levUsr);
  $("#hsym").textContent=SYM;
  LAST=null;   // invalida el estado anterior: si esta corrida falla, el boton
  //              Copiar no puede entregar datos viejos con hora nueva
  $("#out").innerHTML=`<div class="card" style="text-align:center;color:var(--dim)">
    <span class="spin"></span> consultando Binance…</div>`;

  // TF que se PIDEN a Binance. Los de operativa y contexto con 210 velas (hacen
  // falta para EMA200 y para los detectores); los de solo-vista con 60, de sobra
  // para la EMA20 de la alineación y así no se gastan datos del celular de más.
  const TFS=[...TFS_OP, ...TFS_VER];
  let D={};
  try{
    // Filtros del simbolo (tick/step/minNotional).
    // OJO 1: /fapi/v1/exchangeInfo IGNORA el parametro symbol (a diferencia de
    //   spot) y devuelve los 846 pares. Tomar symbols[0] daba el tick de BTCUSDT
    //   (0.1) para TODAS las monedas -> precios cuantizados a la rejilla de
    //   Bitcoin y plan basura. Hay que BUSCAR el simbolo en el array.
    // OJO 2: son ~1 MB. Se cachean en el dispositivo (cambian una vez al año)
    //   para no quemarte datos moviles en cada arranque.
    if(!TICK){
      const ck=`f:${sym}`, cached=localStorage.getItem(ck);
      let fl=null;
      if(cached){ try{ const c=JSON.parse(cached);
        if(Date.now()-c.ts < 30*86400e3) fl=c.f; }catch(e){} }
      if(!fl){
        const xi=await get("/fapi/v1/exchangeInfo");
        const s=(xi.symbols||[]).find(x=>x.symbol===sym);
        if(!s) throw new Error(`${sym} no está listado en Binance USD-M`);
        const m=Object.fromEntries(s.filters.map(x=>[x.filterType,x]));
        fl={t:+m.PRICE_FILTER.tickSize, s:+m.LOT_SIZE.stepSize,
            n:+((m.MIN_NOTIONAL||{}).notional||5)};
        localStorage.setItem(ck, JSON.stringify({ts:Date.now(), f:fl}));
      }
      TICK=fl.t; STEP=fl.s; MINNOT=fl.n;
      if(!(TICK>0)||!(STEP>0)) throw new Error(`filtros inválidos para ${sym}`);
    }
    const [pi,oi,t24,depth] = await Promise.all([
      get("/fapi/v1/premiumIndex",{symbol:sym}),
      get("/fapi/v1/openInterest",{symbol:sym}),
      get("/fapi/v1/ticker/24hr",{symbol:sym}),
      get("/fapi/v1/depth",{symbol:sym,limit:50})
    ]);
    D.mark=+pi.markPrice; D.index=+pi.indexPrice;
    D.fund=+pi.lastFundingRate*100;
    D.fundNext=(pi.nextFundingTime-Date.now())/60000;
    D.oi=+oi.openInterest; D.vol=+t24.quoteVolume; D.chg=+t24.priceChangePercent;
    D.libro=depth; D.bid=+depth.bids[0][0]; D.ask=+depth.asks[0][0];

    const kl = await Promise.all(TFS.map(tf=>get("/fapi/v1/klines",
      {symbol:sym,interval:tf,limit:TFS_OP.includes(tf)?210:60})));
    D.v={}; TFS.forEach((tf,i)=>{ D.v[tf]=kl[i].map(k=>({t:k[0],o:+k[1],h:+k[2],l:+k[3],c:+k[4],vol:+k[5],tbv:+k[9]})); });
    D.v["45m"]=agrupa(D.v["15m"],MS["45m"]);
    D.v["3h"] =agrupa(D.v["1h"], MS["3h"]);

    // las TRES series L/S + taker + OI hist (Binance-exclusivo)
    // period=5m, NO 1h. Medido contra fapi el 2026-07-24: con period=1h la última
    // barra de takerlongshortRatio llega SIEMPRE con ~94 min de edad, y como la edad
    // se toma como el MÁXIMO de las cuatro series, el gate de frescura (>90 min)
    // marcaba la foto como NO VERIFICABLE de forma PERMANENTE. Efecto: 2 de las 4
    // confluencias de contexto (ballenas y taker) fijadas a false para siempre, más
    // 1.5 puntos de calidad que nunca podían sumarse — techo real de la nota = 7.0,
    // o sea scalp (mín 8) era imposible e intraday (mín 7) exigía perfección exacta.
    // Con period=5m las tres series llegan a ~4.6 min y taker a ~9.6 min.
    const [g,ta,tp,tk,oih] = await Promise.all([
      get("/futures/data/globalLongShortAccountRatio",{symbol:sym,period:"5m",limit:2}),
      get("/futures/data/topLongShortAccountRatio",{symbol:sym,period:"5m",limit:1}),
      get("/futures/data/topLongShortPositionRatio",{symbol:sym,period:"5m",limit:1}),
      get("/futures/data/takerlongshortRatio",{symbol:sym,period:"5m",limit:1}),
      get("/futures/data/openInterestHist",{symbol:sym,period:"1h",limit:24})
    ]);
    D.ls={g:+g[g.length-1].longShortRatio, ta:+ta[0].longShortRatio, tp:+tp[0].longShortRatio};
    D.taker=+tk[0].buySellRatio;
    // edad = la PEOR de las series, no la de una sola: la de taker llega mas vieja
    // que las otras tres incluso en 5m (~9.6 vs ~4.6 min).
    D.lsEdad=Math.max(...[g[g.length-1],ta[0],tp[0],tk[0]]
      .map(x=>x&&x.timestamp?(Date.now()-x.timestamp)/60000:0));
    if(oih.length>1){ D.oiUsd=+oih[oih.length-1].sumOpenInterestValue;
      D.oiChg=(+oih[oih.length-1].sumOpenInterest/+oih[0].sumOpenInterest-1)*100; }

    // intervalo REAL de funding (447 de 731 perps no son 8h)
    D.ivH=8; D.ivFuente="default 8h (no listado en fundingInfo)";
    try{ const fi=await get("/fapi/v1/fundingInfo");
      const m=fi.find(x=>x.symbol===sym);
      if(m){ D.ivH=+m.fundingIntervalHours||8; D.ivFuente="fundingInfo"; }
    }catch(e){ D.ivFuente="⚠ fundingInfo falló — asumiendo 8h SIN VERIFICAR"; }
  }catch(e){
    $("#out").innerHTML=`<div class="err"><b>Binance no respondió</b>
      ${e.message}<br><br>
      <span class="nd">No se sustituye por otro exchange: sin dato es sin dato.
      Si es 418/429, tu IP está momentáneamente limitada — espera unos minutos.</span></div>`;
    return;
  }
  // Hora en que los DATOS salieron de Binance. Va en el objeto D, no en render(),
  // porque repintar() vuelve a dibujar con el MISMO D y si el sello se pusiera en
  // render() el bloque que le pegas a Claude juraría que las velas son de ahora
  // mismo cuando en realidad pueden ser de hace un buen rato.
  D.__ts = Date.now();
  render(D, eq, estilo, E, sym, marUsr, levUsr);
}

function render(D, eq, estilo, E, sym, marUsr, levUsr){
  const base=SYM, [tier,TC]=tierDe(base);
  const now=new Date(), ses=sesionCST(now);
  let riesgo=TC.r, degr=[];

  if(riesgo>TC.rmax){ degr.push(`riesgo recortado al máximo ${TC.rmax}% del tier`); riesgo=TC.rmax; }
  if(ses==="weekend"&&riesgo>1.25){ degr.push("weekend: sizing a 1.25%"); riesgo=1.25; }
  // piso de liquidez del tier — estaba declarado en TIERS y NUNCA se leia.
  // T3/T3* por debajo del piso NO se opera; T2 se avisa y se reduce 50%.
  let liqBloq=null;
  if(TC.liq && isFinite(D.vol) && D.vol < TC.liq){
    const t=`liquidez 24h ${(D.vol/1e6).toFixed(1)}M USD < piso ${(TC.liq/1e6).toFixed(0)}M del tier ${tier}`;
    if(TC.core) liqBloq=t;
    else { riesgo=riesgo*0.5; degr.push(`${t}: riesgo reducido 50% → ${riesgo}%`); }
  }

  const ev=EVENTOS[base]; let evBloq=null, evOn=null;
  if(ev && now.getTime()>=ev.ini && now.getTime()<ev.fin){
    evOn=ev.n;
    if(riesgo>TC.r*0.5){ degr.push(`ventana de evento: sizing −50% → ${TC.r*0.5}%`); riesgo=TC.r*0.5; }
    if(Math.abs(now.getTime()-ev.ts)<=1800e3) evBloq=`±30 min del evento: prohibido abrir dirección`;
  }

  // ── setups sobre velas CERRADAS de los TF del estilo ──
  let setups=[];
  for(const tf of E.tfs){
    const cr=D.v[tf]; if(!cr||cr.length<60) continue;
    const v=cerradas(cr); if(v.length<60) continue;
    const cs=v.map(x=>x.c), a=atr(v), e200=ema(cs,200);
    const vt=v.slice(-30).reduce((s,x)=>s+x.vol,0);
    const vwap=vt?v.slice(-30).reduce((s,x)=>s+x.c*x.vol,0)/vt:null;
    for(const d of [detSweep(v),detBOS(v,a),detFVG(v),detEQ(v),detMR(v,e200,vwap,a),
                    (tf==="5m"||tf==="15m")?detMomentumNY(v,a,now):null,
                    detPullback(v,a)])
      if(d){ d.tf=tf; d.atr=a; setups.push(d); }
  }
  if(TC.core) setups=setups.filter(s=>s.core);
  const tfEnt=E.tfs[1];
  setups.sort((x,y)=>{
    const rx=(PRIO_TF[x.tf]||[]).indexOf(x.s), ry=(PRIO_TF[y.tf]||[]).indexOf(y.s);
    return ((rx<0?40+x.prio:rx)-(ry<0?40+y.prio:ry))
        || ((x.core?0:1)-(y.core?0:1))
        || (Math.abs(tfH(x.tf)-tfH(tfEnt))-Math.abs(tfH(y.tf)-tfH(tfEnt)));
  });
  const G=setups[0]||null;
  const conflicto = G && setups.some(s=>s.d!==G.d);

  // ── funding direccional normalizado a base 8h ──
  const contra = G ? (G.d==="long"?D.fund:-D.fund) : null;
  const contra8 = contra!==null ? contra*(8/D.ivH) : null;

  // ── alineación multi-TF: se calcula SIEMPRE y se muestra SIEMPRE ──
  // Antes vivía dentro del bloque "hay setup" y no se renderizaba nunca: alimentaba
  // 2 de los 10 puntos de calidad sin que se pudiera ver de dónde salían.
  // Dirección de UNA temporalidad: precio de la última vela cerrada contra su EMA20.
  const dirTF = t => {
    const c0=D.v[t]; if(!c0) return null;
    const vv=cerradas(c0); if(vv.length<21) return null;   // lo que necesita una EMA20
    const cs=vv.map(x=>x.c), e20=ema(cs,20);
    return e20 ? (cs[cs.length-1]>e20 ? 1 : -1) : null;
  };
  // tfSig alimenta la NOTA y se queda en las 6 temporalidades de siempre: meter
  // 15 en el promedio cambiaría la rúbrica en silencio.
  const tfSig={};
  for(const t of TFS_OP){ const s=dirTF(t); if(s!=null) tfSig[t]=s; }
  // tfVista es solo para mirar: las 15 que pidió Emmanuel.
  const tfVista={};
  for(const t of TF_VISTA){ const s=dirTF(t); if(s!=null) tfVista[t]=s; }
  const sgArr=Object.values(tfSig).filter(x=>x!=null);
  const netoTF=sgArr.length?sgArr.reduce((a,b)=>a+b,0)/sgArr.length:null;
  const vArr=Object.values(tfVista);
  const netoVista=vArr.length?vArr.reduce((a,b)=>a+b,0)/vArr.length:null;

  // ── quién manda: el mismo dato, pero pesado ──
  // El conteo "N arriba / M abajo" trata a 1m igual que a 1M, y eso es justo lo que
  // hacía que no se entendiera hacia dónde va todo: siete temporalidades cortas
  // pueden voltear el resumen mientras el diario y el semanal siguen firmes en la
  // otra dirección. Aquí cada temporalidad pesa lo que dura. Es la MISMA lectura
  // de siempre (precio contra su EMA20), solo que ponderada.
  const PESO_VISTA={"1M":6,"1w":5,"1d":4,"12h":3,"8h":3,"4h":3,"3h":2,"2h":2,"1h":2,
                    "45m":1,"30m":1,"15m":1,"5m":.5,"3m":.5,"1m":.5};
  let sesgo=null;
  {
    let num=0, den=0;
    for(const [t,s] of Object.entries(tfVista)){ const w=PESO_VISTA[t]||1; num+=w*s; den+=w; }
    if(den){
      const score=Math.round(num/den*100), abs=Math.abs(score);
      const dir=score>0?"long":"short";
      const manda = abs>=45 ? "clara" : abs>=20 ? "leve" : "ninguna";
      // El nivel que rompe la lectura. Tiene que estar DEL LADO CORRECTO del precio:
      // el último suelo por DEBAJO (si manda la alza) o el último techo por ENCIMA
      // (si manda la baja). Tomar el último pivote por índice sin más ponía a veces
      // un "suelo" que el precio ya había perdido, y la tarjeta lo presentaba como
      // colchón disponible cuando la lectura ya estaba rota.
      let inval=null, invalTf=null;
      for(const t of ["4h","1h"]){
        const cr=D.v[t]; if(!cr||cr.length<40) continue;
        const [hh,ll]=swings(cerradas(cr).slice(0,-1),3);
        const cand=(dir==="long"?ll:hh).map(x=>x[1])
          .filter(x=>dir==="long" ? x<D.mark : x>D.mark);
        if(cand.length){
          inval = dir==="long" ? Math.max(...cand) : Math.min(...cand);
          invalTf=t; break; }
      }
      // ¿las grandes y las chicas dicen lo mismo?
      const grandes=["1M","1w","1d","12h","8h","4h"].filter(t=>tfVista[t]!=null);
      const chicas =["1h","45m","30m","15m","5m","3m","1m"].filter(t=>tfVista[t]!=null);
      const prom = arr => arr.length ? arr.reduce((a,t)=>a+tfVista[t],0)/arr.length : null;
      sesgo={score, abs, dir, manda, inval, invalTf,
             pGrandes:prom(grandes), pChicas:prom(chicas)};
    }
  }

  let H=[];
  // Lo que antes vivía en "lo que esto NO sabe" y te tocaba a ti. Tus datos dicen
  // que es justo donde se pierde el dinero, así que ahora lo sabe. Solo aparece si
  // hay algo que decir: si vas limpio no te roba la pantalla.
  H.push(alertasDeRiesgo(now));

  // ═══ VEREDICTO ═══
  let bloqueos=[], avisos=[], plan=null, calidad=null, calidadDet=null;

  if(!G){
    H.push(vcard("no","NO OPERAR","ningún setup detectable ahora — ni del banco ni de continuación"));
    H.push(`<div class="card"><div class="sub">Los detectores automáticos cubren 7 patrones.
      CHoCH+OB, OB-HTF, Wyckoff, Three-Drives y Range-HVN son SEMI o MANUAL: si los ves
      en tu gráfico, mándame captura con <b>opera</b> y los evalúo yo.</div></div>`);
  } else {
    // Las confluencias se calculan ANTES de dimensionar: el escalon "CORE con 1
    // confluencia faltante -> riesgo 0.75%" tiene que afectar el TAMAÑO, y antes
    // se calculaba despues (la app dimensionaba 33% mas grande que el Python).
    const cfPre=[];
    if(contra8!==null) cfPre.push([`funding no adverso ${contra8>=0?"+":""}${contra8.toFixed(4)}% base-8h`, contra8<=FUND_OK]);
    const viejaPre=D.lsEdad>90;
    if(D.ls.tp&&D.ls.g) cfPre.push([viejaPre?`ballenas a favor vs retail — NO VERIFICABLE (${D.lsEdad.toFixed(0)} min)`
      :`ballenas a favor vs retail ${D.ls.tp.toFixed(2)} vs ${D.ls.g.toFixed(2)}`,
      !viejaPre && (G.d==="long" ? D.ls.tp-D.ls.g>0.15 : D.ls.tp-D.ls.g<-0.15)]);
    if(D.taker!=null) cfPre.push([viejaPre?`flujo agresor — NO VERIFICABLE`:`taker ${D.taker.toFixed(3)}`,
      !viejaPre && (G.d==="long"?D.taker>1.05:D.taker<0.95)]);
    if(D.oiChg!=null){
      const barr=["Sweep+Reclaim","EQH/EQL-Sweep"].includes(G.s);
      cfPre.push([barr?`OI ${pct(D.oiChg)} post-sweep`:`OI ${pct(D.oiChg)} vs precio ${pct(D.chg)}`,
        barr ? D.oiChg<-0.5 : (D.oiChg>1 && ((G.d==="long"&&D.chg>0)||(G.d==="short"&&D.chg<0)))]);
    }
    G.cf=cfPre;
    const cumplidas=cfPre.filter(c=>c[1]).length;
    if(!TC.core && G.core && cumplidas===TC.conf-1){
      riesgo=Math.min(riesgo,0.75);
      degr.push("le falta 1 señal de acompañamiento: bajo el tamaño al 0.75% de la cuenta");
    }

    // La CALIDAD se calcula ANTES de dimensionar, porque el R:R mínimo de scalp
    // depende de ella: SKILL.md:77 dice "1.3:1 si calidad >= 8/10; 2:1 si calidad
    // < 8". O sea la skill SI contempla operar scalp por debajo de 8, exigiendo
    // mas R:R — no es un veto. El codigo lo trataba como minimo duro.
    // tfSig ya viene calculado arriba.
    const a15c=atr(cerradas(D.v["15m"]||[]));
    const [cal,calDet]=calcularCalidad(G,tfSig,G.d,D.ls,contra8,
      a15c?a15c/D.mark*100:null,ses,conflicto,D.lsEdad);
    calidad=cal; calidadDet=calDet;
    const calMin=Math.max(TC.cal,E.cal);
    // R:R efectivo (checklist-pre-trade.md:41-44)
    //   Swing >= 2.5 · Intraday >= 2.0 · Scalp >=8/10 -> 1.3 · Scalp <8/10 -> 2.0
    const rrEfec = estilo==="scalp" ? (cal>=8 ? 1.3 : 2.0) : E.rr;
    const E2 = {...E, rr: rrEfec};

    plan = dimensionar(D,G,eq,riesgo,estilo,E2,TC,sym,contra,contra8,marUsr,levUsr);
    bloqueos=plan.bloq; avisos=plan.avisos;
    if(evBloq) bloqueos.unshift(evBloq);
    if(liqBloq) bloqueos.unshift(liqBloq);
    plan.cf=cfPre;
    if(estilo==="scalp") avisos.push(cal>=8
      ? `nota ${cal.toFixed(1)} ≥ 8, así que en scalp te basta un R:R de 1.3×`
      : `nota ${cal.toFixed(1)} &lt; 8, así que en scalp el R:R sube a 2.0× (tu regla, SKILL.md:77)`);
    // La calidad se reporta SIEMPRE. Antes iba condicionada a `!bloqueos.length`,
    // así que cualquier otro bloqueo la escondía y la lista de "qué falta" salía
    // incompleta: parecía que arreglando una cosa se destrabaría el trade.
    // ── DUROS vs BLANDOS, por ORIGEN y no por texto ──
    // Antes se clasificaba con un regex contra el mensaje. Al reescribir los
    // mensajes en lenguaje llano el regex dejo de casar y un NO OPERAR se
    // degrado solo a MARGINAL: clasificar por el texto de la UI es fragil por
    // construccion. Ahora: todo lo que sale de dimensionar() o de los gates de
    // evento/liquidez es DURO (es riesgo real); lo que agrega la nota es BLANDO.
    const duros=[...bloqueos];
    const blandos=[...(plan.blandos||[])];
    if(!G.core && cal<8) blandos.push(`es un patrón oportunista, no de los principales: con esos exiges nota 8 y va en ${cal.toFixed(1)}`);
    else if(cal<calMin)
      blandos.push(`la nota del trade es <b>${cal.toFixed(1)} de 10</b> y para ${sym.replace("USDT","")} en ${estilo} necesitas ${calMin}`);
    bloqueos=[...duros,...blandos];
    const veredicto = duros.length ? "NO OPERAR" : (blandos.length ? "MARGINAL" : "OPERAR");
    H.push(vcard(duros.length?"no":(blandos.length?"wt":"op"), veredicto,
      `${G.s} <b>${G.d==="long"?"a la alza":"a la baja"}</b> en velas de ${G.tf} · ${estilo} · nota ${cal.toFixed(1)}/10 (necesitas ${calMin})`,
      bloqueos.length?bloqueos:null));
    if(veredicto==="MARGINAL") H.push(`<div class="card">${cruce(
      `<b class="wa">MARGINAL</b> quiere decir: <b>no hay nada peligroso</b> en este trade —
       el tamaño, el stop y la liquidación están bien—, lo único que pasa es que la nota no
       llega al mínimo que tú mismo pusiste. El plan de abajo está completo y se puede ejecutar
       tal cual. Tomarlo con nota baja es decisión tuya; tu regla dice que no.`,"ojo")}</div>`);
    bloqueos=duros;   // solo los duros suprimen el sizing
    // que componente esta costando mas: el de mayor hueco contra su maximo
    const TOPE={"el mercado te acompaña":3,"temporalidades del mismo lado":2,
                "los grandes van contigo":1.5,"funding":1.5,
                "se mueve lo suficiente":1,"qué tan bueno es el patrón":1};
    const huecos=calDet.map(x=>[x[0],(TOPE[x[0]]||0)-x[1]]).filter(x=>x[1]>0.01)
                       .sort((a,b)=>b[1]-a[1]);
    const falta=(calMin-cal);
    H.push(`<div class="card"><h2>Nota del trade · ${cal.toFixed(1)} de 10</h2>${calDet.map(x=>
      `<div class="kv"><span class="k">${x[0]}</span><span class="v ${x[1]<0?'dn':x[1]>0?'up':'nd'}">${x[1]>=0?"+":""}${x[1].toFixed(2)}</span></div>
       <div class="sub" style="text-align:right">${x[2]}</div>`).join("")}
      ${cruce(falta>0
        ? `Te faltan <b>${falta.toFixed(1)} puntos</b> para el mínimo de ${calMin} que pide ${estilo}. ` +
          (huecos.length ? `Lo que más te está costando: <b>${huecos[0][0]}</b> (${huecos[0][1].toFixed(1)} pts sin cobrar)${
            huecos[1]?`, luego ${huecos[1][0]} (${huecos[1][1].toFixed(1)})`:""}.` : "")
        : `Pasas el mínimo de ${calMin} con ${(cal-calMin).toFixed(1)} puntos de sobra.`,
        falta>0?"ojo":"ok")}</div>`);
  }

  // ── alineación multi-TF, visible siempre ──
  if(vArr.length){
    // Las 6 que cuentan para la nota van marcadas; las demás son solo lectura.
    const chips=TF_VISTA.filter(t=>tfVista[t]!=null).map(t=>
      `<span class="pill ${tfVista[t]>0?'up':'dn'}"${TFS_OP.includes(t)?' style="outline:1px solid var(--acc);outline-offset:1px"':''}>${t} ${tfVista[t]>0?"▲":"▼"}</span>`).join(" ");
    const faltan=TF_VISTA.filter(t=>tfVista[t]==null);
    const arriba=vArr.filter(x=>x>0).length, abajo=vArr.length-arriba;
    const unan = arriba===0 || abajo===0;
    const lado = netoVista>0.3 ? (unan?"todas apuntan hacia arriba":"la mayoría apunta hacia arriba")
               : netoVista<-0.3 ? (unan?"todas apuntan hacia abajo":"la mayoría apunta hacia abajo")
               : "están divididas";
    const aFavor = G ? (G.d==="long"?netoVista:-netoVista)>0 : null;
    const aFavorNota = G ? (G.d==="long"?netoTF:-netoTF)>0 : null;
    H.push(`<div class="card"><h2>Hacia dónde apunta cada temporalidad</h2>
      ${sesgo?(()=>{
        const col = sesgo.manda==="ninguna" ? "var(--dim)" : (sesgo.dir==="long"?"var(--ok)":"var(--no)");
        const txt = sesgo.manda==="ninguna" ? "SIN RUMBO CLARO"
                  : (sesgo.dir==="long"?"MANDA LA ALZA":"MANDA LA BAJA") + (sesgo.manda==="leve"?", pero poco":"");
        const ancho=Math.min(50,sesgo.abs/2), izq=sesgo.score>=0?50:50-ancho;
        const desacuerdo = sesgo.pGrandes!=null && sesgo.pChicas!=null
          && Math.sign(sesgo.pGrandes)!==Math.sign(sesgo.pChicas)
          && sesgo.pGrandes!==0 && sesgo.pChicas!==0;
        return `<div style="font-size:26px;font-weight:800;letter-spacing:-.8px;color:${col};line-height:1.1">${txt}</div>
        <div class="sub" style="margin-top:3px">fuerza ${sesgo.abs} de 100 · pesando cada temporalidad
          por lo que dura, no contándolas todas igual</div>
        <div style="height:7px;border-radius:4px;background:var(--card2);margin:9px 0 2px;position:relative;overflow:hidden">
          <i style="position:absolute;top:0;bottom:0;left:${izq}%;width:${ancho}%;border-radius:4px;background:${col}"></i>
          <span style="position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--dim2);opacity:.5"></span>
        </div>
        ${desacuerdo?`<div class="sub wa" style="margin-top:5px">Ojo: las temporalidades largas van
          <b>${sesgo.pGrandes>0?"hacia arriba":"hacia abajo"}</b> y las cortas
          <b>${sesgo.pChicas>0?"hacia arriba":"hacia abajo"}</b>. Cuando pasa esto, lo de las cortas
          suele ser un respiro dentro de lo de las largas, no un cambio de rumbo.</div>`:""}
        ${(sesgo.inval!=null && sesgo.manda!=="ninguna")?`<div class="sub" style="margin-top:5px">Esta
          lectura se rompe si ${sesgo.dir==="long"?"pierde":"recupera"} <b>${f(sesgo.inval)}</b> — el
          ${sesgo.dir==="long"?"suelo":"techo"} de ${sesgo.invalTf} más cercano
          ${sesgo.dir==="long"?"por debajo":"por encima"} del precio, a
          ${(Math.abs(D.mark-sesgo.inval)/D.mark*100).toFixed(2)}% de aquí.</div>`:""}`;
      })():""}
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin:8px 0">${chips}</div>
      ${kv("resumen", `<b class="${netoVista>0?'up':netoVista<0?'dn':'nd'}">${arriba} arriba / ${abajo} abajo</b>`,
        `${lado} · verde = el precio va sobre su promedio de 20 velas de esa temporalidad`)}
      ${faltan.length?`<div class="sub">sin suficiente historia para ${faltan.join(" · ")}</div>`:""}
      ${cruce(G
        ? `Tu trade es <b>${G.d==="long"?"a la alza (LONG)":"a la baja (SHORT)"}</b> y en conjunto las
           temporalidades van <b>${aFavor?"del mismo lado":"del lado contrario"}</b>.
           ${aFavorNota===aFavor ? "" : `Ojo: en las 6 que cuentan para la nota van del lado
           ${aFavorNota?"contrario":"mismo"}, y esas son las que mueven el puntaje.`}
           ${aFavorNota ? "Esa parte de la nota sí te suma."
                        : "Por eso esa parte de la nota no te suma."}`
        : `${lado.charAt(0).toUpperCase()+lado.slice(1)}. Cuando aparezca un setup, si va del mismo lado suma nota; si va en contra, no.`,
        G ? (aFavorNota?"ok":"mal") : "")}
      <div class="sub" style="margin-top:6px">Las ${TFS_OP.length} con borde
        (${TFS_OP.join(", ")}) son las que entran en la nota. 45m y 3h no existen en
        Binance: se arman juntando 3 velas de 15m y de 1h.</div></div>`);
  }

  if(evOn) H.push(`<div class="card" style="border-color:rgba(240,169,46,.4)">
    <span class="wa">📅 VENTANA DE EVENTO ACTIVA</span><div class="sub">${evOn}</div></div>`);
  if(degr.length) H.push(`<div class="card"><span class="wa">⚠ ${degr.join(" · ")}</span></div>`);

  // ── PLAN ──
  // Cada bloque se guarda por la clave que REALMENTE usa: dimensionar() puede
  // retornar temprano con 'entry' ya calculado pero sin tps/qty (granularidad,
  // tope de stop, margen, falta de estructura). Guardar todo con 'entry' hacia
  // reventar el render antes de imprimir el motivo del bloqueo.
  if(plan && plan.entry){
    const p=plan, no=bloqueos.length;
    let planHtml=`<div class="card">
      <h2>Cómo se opera · ${G.d==="long"?"A LA ALZA":"A LA BAJA"} ${no?'· <span class="dn">SOLO DE REFERENCIA, NO ENTRAR</span>':''}</h2>
      ${kv("entras en", `<b>${f(p.entry)}</b> <span class="pill">${p.tipo}</span>`)}
      ${kv("te sales si llega a", `<b class="dn">${f(p.stop)}</b>`,
        `es ${p.stopPct.toFixed(2)}% del precio — el movimiento típico de una vela de ${G.tf} es ${p.atrPct.toFixed(2)}%`)}`;
    if(p.tps&&p.tps.length&&p.be!=null){
      const R=p.riesgoUsd||0;
      planHtml += `<div style="margin-top:10px;padding-top:9px;border-top:1px dashed var(--line)">
        <div class="sub" style="margin-bottom:6px;letter-spacing:.5px">CÓMO SALES — POR PARTES, NO DE GOLPE</div>
        ${p.tps.map(t=>kv(
          `<b>${Math.round(t.frac*100)}%</b> en ${f(t.px)}`,
          `<span class="${t.rn>=1?'up':t.rn>0?'wa':'dn'}">${t.rn>=0?"+":""}${t.rn.toFixed(2)}×</span>`,
          `${t.nota} · te llevas ${(R*t.rn*t.frac).toFixed(2)} USDT de este tramo · llegaría en ~${
            t.etaH<1?Math.round(t.etaH*60)+" min":t.etaH.toFixed(1)+" h"}${
            t.set?` · pagas funding ${t.set} vez(ces) en el camino`:""}`)).join("")}
        ${kv(`subes el stop a`, `<b class="ac">${f(p.be)}</b>`,
          `en cuanto toque el primer objetivo — y a ESE precio, no a tu entrada: ahí ya cubres
           comisiones y deslizamiento, así que la operación deja de poder hacerte daño`)}
        ${kv(`el stop persigue a`, `<b class="ac">${p.trailPct.toFixed(2)}%</b>`,
          `después del segundo objetivo, el stop va siguiendo al ${G.d==="long"?"máximo":"mínimo"}
           ${G.d==="long"?"menos":"más"} ${f(p.trail)} y se recalcula en cada vela — no es un nivel fijo.
           <b>Nunca ${G.d==="long"?"por debajo":"por encima"} de ${f(p.be)}</b>: una vez que subiste el stop,
           no vuelve a bajar${p.trailAcotado?` (por eso esta distancia va recortada: 2.5 velas típicas
           te habrían mandado por detrás del break-even)`:""}`)}
      </div>
      <div style="margin-top:10px;padding-top:9px;border-top:1px dashed var(--line)">
        <div class="sub" style="margin-bottom:5px;letter-spacing:.5px">QUÉ TE DEJA CADA ESCENARIO</div>
        ${kv("toca el primero y se devuelve", `<span class="${p.rMin>=0?'up':'dn'}">${p.rMin>=0?"+":""}${p.rMin.toFixed(2)}×</span>`,
          `${(R*p.rMin).toFixed(2)} USDT — antes esto era cero o pérdida`)}
        ${kv("llega al segundo", `<span class="${p.rMed>=0?'up':'dn'}">${p.rMed>=0?"+":""}${p.rMed.toFixed(2)}×</span>`,
          `${(R*p.rMed).toFixed(2)} USDT`)}
        ${kv("la escalera completa", `<span class="${p.rMax>=0?'up':'dn'}">${p.rMax>=0?"+":""}${p.rMax.toFixed(2)}×</span>`,
          `${(R*p.rMax).toFixed(2)} USDT${p.rrMin?` · tu regla de ${estilo} pide ${p.rrMin}×${p.rMax>=p.rrMin?" — cumple":" — no llega"}`:""}`)}
        ${kv("si te pega el stop", `<b class="dn">−${p.perdida.toFixed(2)}×</b>`,
          `pierdes ${(R*p.perdida).toFixed(2)} USDT: los ${R.toFixed(2)} del stop más ${(R*p.friR2).toFixed(2)} de comisiones y deslizamiento — perder también cuesta entrar y salir`)}
      </div>
      <div class="sub" style="margin-top:6px">Los objetivos salen de ${p.fuente}. El número
        "×" ya trae descontadas las comisiones, el deslizamiento y el funding.</div>`;
    } else {
      planHtml += `<div class="sub wa">sin objetivos calculados — mira el motivo arriba</div>`;
    }
    if(p.tps&&p.tps.length&&p.riesgoUsd&&p.esperanza!=null){
      const R=p.riesgoUsd, gana=p.esperanza>0;
      planHtml += cruce(`De cada 100 operaciones aciertas 55 — eso ya lo haces bien y no es lo que
        hay que arreglar. Con esta forma de salir, esas 100 operaciones te dejan
        <b class="${gana?'up':'dn'}">${p.esperanza>=0?"+":""}${p.esperanza.toFixed(3)}×</b> de promedio
        cada una, o sea ${(R*p.esperanza).toFixed(2)} USDT por operación.
        <br><br>Pero eso vale <b>solo si respetas el stop</b>. En junio-julio tu pérdida media fue de
        <b class="dn">1.69 veces</b> lo que decías arriesgar, no 1.00. Con esa pérdida media, las mismas
        100 operaciones te dejan <b class="dn">${p.esperanzaSinStop.toFixed(3)}×</b> cada una —
        ${(R*p.esperanzaSinStop).toFixed(2)} USDT. La diferencia entre las dos líneas no la pone la app:
        la pones tú cuando el precio va en contra y decides si mueves el stop o no.`,
        gana?"ok":"ojo");
    }
    H.push(planHtml+`</div>`);

        ${p.liq?`La liquidación de ${f(p.liq)} es <b>teórica</b> y está lejos: tu stop salta mucho antes.
        Además tu cuenta es Portfolio Margin, así que Binance no liquida esta posición sola sino

    </div>`);

    if(p.cf&&p.cf.length){
      const ok=p.cf.filter(c=>c[1]).length;
      H.push(`<div class="card"><h2>Qué tanto acompaña el resto del mercado</h2>
      ${p.cf.map(c=>`<div class="kv"><span class="k">${c[1]?'<span class="up">✓</span>':'<span class="nd">✗</span>'} ${c[0]}</span></div>`).join("")}
      ${cruce(`Se cumplen <b>${ok} de ${p.cf.length}</b>. No son un veto: cada una que se cumple
        te sube la nota del trade. Son las señales de que el resto del mercado (financiamiento,

    }
    if(avisos.length) H.push(`<div class="card">${avisos.map(a=>`<div class="wa" style="font-size:12.5px">⚠ ${a}</div>`).join("")}</div>`);
  }

  // ── TU DÍA ── (marcador: útil pero no urgente, por eso va después del plan)
  H.push(tarjetaSesion(now));

  // ── MERCADO ──
  const fTier = contra8===null?"":(Math.abs(contra8)<=FUND_OK?"up":Math.abs(contra8)<=FUND_NO?"wa":"dn");
  if(base.startsWith("1000")) H.push(`<div class="card" style="border-color:rgba(240,169,46,.4)">
    <span class="wa">⚠ CONTRATO ×1000</span><div class="sub">el precio es por 1000 ${base.slice(4)},

  const nocional = (plan&&plan.notional) ? plan.notional : null;
  const costo4h = contra8!==null && nocional ? nocional*(contra8/100)*(4/8) : null;
  H.push(`<div class="card"><h2>Cómo está el mercado</h2>
    ${kv("precio ahora", `<b>${f(D.mark)}</b>`,
      `la referencia del índice va en ${f(D.index)} · comprar y vender cuesta ${((D.ask/D.bid-1)*1e4).toFixed(1)} centésimas de 1%`)}
    ${kv("hoy lleva", `<span class="${D.chg>=0?'up':'dn'}">${pct(D.chg)}</span>`,
      `se han movido ${(D.vol/1e6).toFixed(0)} millones de dólares en 24h`)}
    ${kv("funding", `<span class="${fTier}">${D.fund>=0?"+":""}${D.fund.toFixed(4)}%</span> cada ${D.ivH}h`,
      `${D.fund>=0?"ahorita los largos le pagan a los cortos":"ahorita los cortos le pagan a los largos"} · el próximo cobro es en ${D.fundNext.toFixed(0)} min`)}
    ${kv("dinero abierto", `${(D.oi/1e6).toFixed(1)}M ${base}`,
      D.oiUsd?`${(D.oiUsd/1e6).toFixed(0)}M USD en posiciones vivas · ${pct(D.oiChg)} en 24h`:"")}
    ${cruce(contra8===null
      ? `Sin setup todavía, así que el funding no se puede cruzar contra una dirección.`
      : `${contra8<=0
          ? `El funding va <b>a tu favor</b>: te <b class="up">pagan</b> por mantener el trade`
          : `El funding va <b>en tu contra</b>: te <b class="dn">cobran</b> por mantener el trade`}${
        costo4h!==null ? ` — unos <b>${Math.abs(costo4h).toFixed(2)} USDT si lo aguantas 4 horas</b>` : ""}.
        ${Math.abs(contra8)<=FUND_OK ? "Es poco, no cambia nada."
          : Math.abs(contra8)<=FUND_NO ? "Ya pesa: no lo dejes abierto más de 4 horas."
          : "Está carísimo: a este nivel el trade se come solo."}
        ${D.oiChg!=null ? ` El dinero abierto ${D.oiChg>1?"está <b>subiendo</b>, o sea entra gente nueva":
          D.oiChg<-0.5?"está <b>bajando</b>, o sea la gente está cerrando":"casi no se mueve"}.`:""}`,
      contra8===null?"":(contra8<=FUND_OK?"ok":contra8<=FUND_NO?"ojo":"mal"))}
  </div>`);

  // ── POSICIONAMIENTO ──
  const vieja=D.lsEdad>90, sp=D.ls.tp-D.ls.g;
  const pctL = x => (x/(1+x)*100);
  const ballenasLargas = D.ls.tp>1;
  const aFavorBallenas = G ? (G.d==="long" ? sp>0.15 : sp<-0.15) : null;
  H.push(`<div class="card"><h2>De qué lado está cada quién</h2>
    ${kv("la gente común", `${pctL(D.ls.g).toFixed(0)}% a la alza`,
      `${(100-pctL(D.ls.g)).toFixed(0)}% a la baja · son todas las cuentas de Binance`)}
    ${kv("los grandes, por dinero", `<b class="ac">${pctL(D.ls.tp).toFixed(0)}% a la ${ballenasLargas?"alza":"baja"}</b>`,
      `el top de traders pesado por el tamaño de su posición — es el dato que más importa`)}
    ${kv("los grandes, por cabeza", `${pctL(D.ls.ta).toFixed(0)}% a la alza`,
      `el mismo top pero contando cuentas, sin pesar cuánto mete cada uno`)}
    ${kv("qué tan distinto piensan", `<span class="${sp>0?'up':'dn'}">${sp>=0?"+":""}${sp.toFixed(2)}</span>`,
      sp>0?"los grandes están más a la alza que la gente común":"los grandes están más a la baja que la gente común")}
    ${kv("quién está pegando ahora", `${D.taker>1?"compradores":"vendedores"}`,
      `proporción ${D.taker.toFixed(2)} de órdenes que entran a mercado`)}
    ${kv("frescura del dato", `<span class="${vieja?'wa':'nd'}">${D.lsEdad.toFixed(0)} min</span>`,
      vieja?"⚠ más de 90 min: no lo cuento como confluencia":"reciente, sí cuenta")}
    ${cruce(G
      ? `Tu trade es <b>${G.d==="long"?"a la alza":"a la baja"}</b> y los grandes están
         <b>${ballenasLargas?"a la alza":"a la baja"}</b>: ${
         aFavorBallenas
           ? `<b>van contigo</b>. Eso es de lo mejor que te puede pasar, te suma nota.`
           : `<b>van del lado contrario</b>. Se puede operar igual, pero es exactamente el

              esta parte de la nota no suma.`}`
      : `Los grandes están <b>${ballenasLargas?"a la alza":"a la baja"}</b> y la gente común
         ${pctL(D.ls.g)>50?"también a la alza":"a la baja"}. Cuando salga un setup, si va del
         mismo lado que los grandes suma nota.`,
      G ? (aFavorBallenas?"ok":"mal") : "")}

  // ── MULTI-TF ──
  let rows="";
  for(const tf of TF_VISTA){
    const cr=D.v[tf]; if(!cr||cr.length<22){ rows+=`<tr><td>${tf}</td><td colspan="5" class="nd">sin historia</td></tr>`; continue; }
    const v=cerradas(cr), cs=v.map(x=>x.c), a=atr(v), e20=ema(cs,20), e200=ema(cs,200);
    const px=cs[cs.length-1], u=v[v.length-1], r=rsi(cs);
    const dl=u.vol?((2*u.tbv-u.vol)/u.vol*100):null;
    const tri=(e)=>e==null?'<span class="nd">s/d</span>':(px>e?'<span class="up">+</span>':'<span class="dn">−</span>');
    rows+=`<tr><td>${tf}</td><td>${r==null?'<span class="nd">s/d</span>':r.toFixed(1)}</td>
      <td>${a?(a/px*100).toFixed(2):'<span class="nd">s/d</span>'}</td>
      <td>${tri(e20)}</td><td>${tri(e200)}</td>

  H.push(`<div class="card"><h2>Detalle por temporalidad</h2>

    ${cruce(`<b>fuerza</b> = RSI: arriba de 70 viene muy comprado, abajo de 30 muy vendido.

  // ── SETUPS ──
  // "no entiendo los setups automaticos tampoco, si estan activos o que":
